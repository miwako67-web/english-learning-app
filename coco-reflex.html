<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CoCo's Reflex Training — 瞬間反射 3層システム</title>
<link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@400;600;700&family=DM+Sans:ital,wght@0,300;0,400;0,500;1,300;1,400&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#1a1410;--paper:#f5f0e8;--gold:#c8962a;--moss:#4a7c59;
  --indigo:#3d5a8a;--crimson:#a03030;--panel:#fffdf8;--border:rgba(26,20,16,0.12);
}
*{margin:0;padding:0;box-sizing:border-box;}
body{font-family:'DM Sans',sans-serif;background:var(--paper);color:var(--ink);min-height:100vh;}

/* HEADER */
header{background:var(--ink);padding:16px 20px 0;position:sticky;top:0;z-index:100;}
.h-top{display:flex;align-items:center;gap:10px;padding-bottom:12px;}
.h-titles{flex:1;}
.h-titles h1{font-family:'Shippori Mincho',serif;color:var(--gold);font-size:16px;font-weight:700;}
.h-titles p{color:rgba(245,240,232,0.42);font-size:10px;margin-top:1px;}
.h-score{text-align:right;}
.h-score .num{font-size:20px;font-weight:500;color:var(--gold);}
.h-score .lbl{font-family:'Shippori Mincho',serif;font-size:9px;color:rgba(245,240,232,0.4);}
nav{display:flex;}
.tab{flex:1;padding:8px 2px;background:none;border:none;border-bottom:2px solid transparent;
  color:rgba(245,240,232,0.38);font-family:'DM Sans',sans-serif;font-size:9px;cursor:pointer;
  transition:all .2s;display:flex;flex-direction:column;align-items:center;gap:2px;}
.tab span:first-child{font-size:13px;}
.tab.active{color:var(--gold);border-bottom-color:var(--gold);}

main{padding:14px;max-width:600px;margin:0 auto;}
.page{display:none;}.page.active{display:block;}
.sec{font-family:'Shippori Mincho',serif;font-size:10px;font-weight:600;
  color:rgba(26,20,16,0.35);letter-spacing:.12em;text-transform:uppercase;margin:16px 0 10px;}

/* SCENE CHIPS */
.scene-chips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px;}
.sc{padding:6px 13px;border-radius:20px;border:1.5px solid var(--border);
  background:var(--panel);font-size:11px;cursor:pointer;transition:all .2s;color:var(--ink);}
.sc.active{background:var(--ink);color:var(--paper);border-color:var(--ink);}

/* MODE SELECTOR */
.mode-row{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-bottom:16px;}
.mode-btn{background:var(--panel);border:1.5px solid var(--border);border-radius:12px;
  padding:12px 8px;cursor:pointer;transition:all .2s;text-align:center;}
.mode-btn:hover{border-color:var(--gold);}
.mode-btn.active{border-color:var(--gold);background:rgba(200,150,42,0.08);}
.mode-emoji{font-size:20px;margin-bottom:4px;}
.mode-name{font-size:11px;font-weight:500;margin-bottom:2px;}
.mode-desc{font-family:'Shippori Mincho',serif;font-size:9px;color:rgba(26,20,16,0.45);line-height:1.4;}

.start-btn{width:100%;padding:14px;border-radius:12px;border:none;background:var(--ink);
  color:var(--gold);font-family:'DM Sans',sans-serif;font-size:15px;font-weight:500;
  cursor:pointer;margin-bottom:4px;}
.start-btn:hover{opacity:.88;}

/* LAYER BADGE */
.layer-badge{display:inline-flex;align-items:center;gap:6px;background:rgba(200,150,42,0.1);
  border:1px solid rgba(200,150,42,0.25);border-radius:20px;padding:4px 12px;
  font-size:10px;font-weight:600;color:var(--gold);letter-spacing:.06em;margin-bottom:12px;}

/* TRAINING */
.train-hd{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px;}
.t-ctr{font-size:11px;color:rgba(26,20,16,0.4);}
.t-pw{flex:1;height:4px;background:var(--border);border-radius:2px;margin:0 10px;overflow:hidden;}
.t-pf{height:100%;background:var(--gold);border-radius:3px;transition:width .4s;}
.quit-btn{font-size:11px;color:rgba(26,20,16,0.35);background:none;border:none;cursor:pointer;text-decoration:underline;}

/* TIMER */
.timer-wrap{display:flex;flex-direction:column;align-items:center;margin-bottom:12px;gap:4px;}
.timer-ring{position:relative;width:72px;height:72px;}
.timer-ring svg{transform:rotate(-90deg);}
.timer-ring circle{fill:none;stroke-width:6;}
.t-bg{stroke:var(--border);}
.t-fg{stroke:var(--gold);stroke-linecap:round;transition:stroke-dashoffset .1s linear,stroke .3s;}
.timer-num{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
  font-size:22px;font-weight:500;color:var(--ink);}
.timer-label{font-family:'Shippori Mincho',serif;font-size:10px;color:rgba(26,20,16,0.4);}

/* LOOP BANNER */
.loop-banner{background:rgba(200,150,42,0.1);border:1px solid rgba(200,150,42,0.3);
  border-radius:10px;padding:8px 14px;margin-bottom:12px;font-family:'Shippori Mincho',serif;
  font-size:12px;color:var(--gold);text-align:center;line-height:1.6;}

/* FLASH CARD */
.flash-card{background:var(--panel);border:1.5px solid var(--border);border-radius:18px;
  padding:26px 20px;text-align:center;margin-bottom:12px;
  box-shadow:0 4px 20px rgba(26,20,16,0.08);min-height:190px;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  cursor:pointer;transition:border-color .2s;}
.flash-card.revealed{border-color:var(--moss);}
.flash-card.correct{border-color:var(--moss);background:rgba(74,124,89,0.05);}
.flash-card.wrong{border-color:var(--crimson);}

.card-scene{font-size:10px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;
  color:rgba(26,20,16,0.28);margin-bottom:8px;}
.card-situation{font-family:'Shippori Mincho',serif;font-size:11px;color:var(--indigo);
  background:rgba(61,90,138,0.08);border-radius:6px;padding:4px 10px;margin-bottom:12px;}
.card-jp{font-family:'Shippori Mincho',serif;font-size:21px;font-weight:700;
  line-height:1.55;margin-bottom:4px;}
.card-hint{font-size:11px;color:rgba(26,20,16,0.3);font-style:italic;margin-top:6px;}
.card-en{font-size:17px;font-weight:500;line-height:1.5;margin-bottom:6px;display:none;}
.card-alt{font-size:12px;color:rgba(26,20,16,0.48);display:none;font-style:italic;margin-bottom:8px;}
.card-tip{font-family:'Shippori Mincho',serif;font-size:11px;color:var(--indigo);
  background:rgba(61,90,138,0.08);border-radius:6px;padding:7px 10px;display:none;
  line-height:1.65;text-align:left;width:100%;}
.flash-card.revealed .card-en,.flash-card.revealed .card-alt,.flash-card.revealed .card-tip{display:block;}
.flash-card.revealed .card-hint{display:none;}

/* STREAK */
.streak-row{display:flex;align-items:center;justify-content:center;gap:6px;margin-bottom:10px;}
.streak-dot{width:14px;height:14px;border-radius:50%;background:var(--border);transition:background .3s;}
.streak-dot.filled{background:var(--moss);}

/* ACTION BUTTONS */
.act-row{display:flex;gap:8px;margin-bottom:8px;}
.act-btn{flex:1;padding:12px;border-radius:11px;border:none;
  font-family:'DM Sans',sans-serif;font-size:13px;font-weight:500;cursor:pointer;transition:opacity .15s;}
.act-btn:hover{opacity:.85;}
.act-reveal{background:var(--indigo);color:#fff;flex:2;}
.act-ok{background:var(--moss);color:#fff;}
.act-ng{background:rgba(160,48,48,0.12);color:var(--crimson);}
.act-skip{width:100%;padding:9px;border-radius:9px;border:1.5px solid var(--border);
  background:var(--panel);font-family:'DM Sans',sans-serif;font-size:11px;cursor:pointer;color:rgba(26,20,16,0.42);}

/* RESULT */
.result-box{text-align:center;padding:24px 0;}
.res-emoji{font-size:54px;margin-bottom:12px;}
.res-title{font-family:'Shippori Mincho',serif;font-size:22px;font-weight:700;margin-bottom:6px;}
.res-sub{font-size:13px;color:rgba(26,20,16,0.5);margin-bottom:22px;font-family:'Shippori Mincho',serif;}
.res-stats{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-bottom:20px;}
.rs{background:var(--panel);border:1px solid var(--border);border-radius:12px;padding:12px 8px;text-align:center;}
.rs-n{font-size:24px;font-weight:500;line-height:1;margin-bottom:3px;}
.rs-n.g{color:var(--moss);}.rs-n.r{color:var(--crimson);}.rs-n.b{color:var(--indigo);}
.rs-l{font-family:'Shippori Mincho',serif;font-size:9px;color:rgba(26,20,16,0.4);}
.res-btns{display:flex;flex-direction:column;gap:8px;}
.res-btn{padding:13px;border-radius:12px;border:none;font-family:'DM Sans',sans-serif;
  font-size:13px;font-weight:500;cursor:pointer;transition:opacity .2s;}
.res-btn:hover{opacity:.85;}
.res-btn.p{background:var(--crimson);color:#fff;}
.res-btn.s{background:var(--ink);color:var(--paper);}
.res-btn.t{background:var(--panel);color:var(--ink);border:1.5px solid var(--border);}

/* SCENE GUIDE PAGE */
.scene-guide{background:var(--panel);border:1px solid var(--border);border-radius:14px;
  overflow:hidden;margin-bottom:14px;}
.sg-hd{background:var(--ink);padding:10px 16px;display:flex;align-items:center;justify-content:space-between;}
.sg-title{font-size:13px;color:var(--gold);font-weight:500;}
.sg-count{font-size:11px;color:rgba(245,240,232,0.45);}
.sg-body{padding:14px;}
.chunk-item{display:flex;gap:12px;align-items:flex-start;padding:10px 0;
  border-bottom:1px solid var(--border);}
.chunk-item:last-child{border-bottom:none;padding-bottom:0;}
.chunk-num{font-size:10px;font-weight:600;color:rgba(26,20,16,0.28);
  width:20px;flex-shrink:0;padding-top:2px;}
.chunk-content{flex:1;}
.chunk-jp{font-family:'Shippori Mincho',serif;font-size:14px;font-weight:600;margin-bottom:3px;}
.chunk-en{font-size:13px;color:rgba(26,20,16,0.6);margin-bottom:3px;}
.chunk-tip{font-family:'Shippori Mincho',serif;font-size:10px;color:var(--indigo);
  background:rgba(61,90,138,0.08);border-radius:5px;padding:3px 7px;display:inline-block;}
.chunk-done{font-size:9px;background:var(--moss);color:#fff;padding:2px 7px;
  border-radius:20px;margin-left:auto;flex-shrink:0;display:none;}
.chunk-done.show{display:inline;}

/* STATS */
.overall{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-bottom:14px;}
.os{background:var(--panel);border:1px solid var(--border);border-radius:12px;padding:13px 8px;text-align:center;}
.os-n{font-size:22px;font-weight:500;line-height:1;margin-bottom:3px;}
.os-n.g{color:var(--moss);}.os-n.gold{color:var(--gold);}.os-n.b{color:var(--indigo);}
.os-l{font-family:'Shippori Mincho',serif;font-size:9px;color:rgba(26,20,16,0.4);}
.scene-stat{background:var(--panel);border:1px solid var(--border);border-radius:11px;padding:12px 14px;margin-bottom:8px;}
.ss-top{display:flex;align-items:center;justify-content:space-between;margin-bottom:6px;}
.ss-name{font-size:13px;font-weight:500;}
.ss-pct{font-size:12px;color:var(--moss);font-weight:500;}
.ss-bar{height:4px;background:var(--border);border-radius:2px;overflow:hidden;}
.ss-fill{height:100%;background:var(--moss);border-radius:2px;transition:width .5s;}
.reset-btn{width:100%;padding:11px;border-radius:10px;border:1.5px solid var(--border);
  background:var(--panel);font-family:'DM Sans',sans-serif;font-size:12px;
  color:rgba(26,20,16,0.4);cursor:pointer;margin-top:12px;}
.reset-btn:hover{border-color:var(--crimson);color:var(--crimson);}
</style>
</head>
<body>

<header>
  <div class="h-top">
    <span style="font-size:26px">🐾</span>
    <div class="h-titles">
      <h1>CoCo's Reflex Training</h1>
      <p>場面別 瞬間反射 3層システム</p>
    </div>
    <div class="h-score">
      <div class="num" id="h-score">0</div>
      <div class="lbl">習得済み</div>
    </div>
  </div>
  <nav>
    <button class="tab active" onclick="switchTab('train',this)"><span>⚡</span><span>反射練習</span></button>
    <button class="tab" onclick="switchTab('guide',this)"><span>📖</span><span>場面ガイド</span></button>
    <button class="tab" onclick="switchTab('stats',this)"><span>📊</span><span>記録</span></button>
  </nav>
</header>

<main>

<!-- ===== TRAIN PAGE ===== -->
<div id="page-train" class="page active">

  <div id="setup-area">
    <div class="sec" style="margin-top:14px">場面を選ぶ</div>
    <div class="scene-chips" id="scene-chips"></div>

    <div class="sec">トレーニング層を選ぶ</div>
    <div class="mode-row">
      <div class="mode-btn active" id="mode-stage1" onclick="selectMode('stage1')">
        <div class="mode-emoji">🃏</div>
        <div class="mode-name">第1層</div>
        <div class="mode-desc">日本語→英語チャンク。自分のペースで。</div>
      </div>
      <div class="mode-btn" id="mode-stage2" onclick="selectMode('stage2')">
        <div class="mode-emoji">⏱️</div>
        <div class="mode-name">第2層</div>
        <div class="mode-desc">3秒タイマー。反射力を鍛える。</div>
      </div>
      <div class="mode-btn" id="mode-stage3" onclick="selectMode('stage3')">
        <div class="mode-emoji">🔁</div>
        <div class="mode-name">第3層</div>
        <div class="mode-desc">5回連続正解で身体化。完全習得を目指す。</div>
      </div>
    </div>
    <button class="start-btn" onclick="startTraining()">トレーニング開始 →</button>
  </div>

  <div id="train-area" style="display:none">
    <div class="layer-badge" id="layer-badge">⚡ 第1層 — チャンク練習</div>
    <div class="train-hd">
      <span class="t-ctr" id="t-ctr">1 / 10</span>
      <div class="t-pw"><div class="t-pf" id="t-pf" style="width:0%"></div></div>
      <button class="quit-btn" onclick="quitTraining()">終了</button>
    </div>

    <div id="timer-area" style="display:none">
      <div class="timer-wrap">
        <div class="timer-ring">
          <svg width="72" height="72" viewBox="0 0 72 72">
            <circle class="t-bg" cx="36" cy="36" r="30"/>
            <circle class="t-fg" id="t-circle" cx="36" cy="36" r="30"
              stroke-dasharray="188.5" stroke-dashoffset="0"/>
          </svg>
          <div class="timer-num" id="t-num">3</div>
        </div>
        <div class="timer-label">口から出たら「見る」をタップ</div>
      </div>
    </div>

    <div id="loop-area" style="display:none">
      <div class="loop-banner">
        🔁 第3層 身体化モード<br>
        あと <span id="loop-left" style="font-size:16px;font-weight:700">5</span> 回連続正解で完全習得！
      </div>
      <div class="streak-row" id="streak-row"></div>
    </div>

    <div class="flash-card" id="flash-card" onclick="revealCard()">
      <div class="card-scene"  id="card-scene"></div>
      <div class="card-situation" id="card-sit"></div>
      <div class="card-jp"    id="card-jp"></div>
      <div class="card-hint">タップして英語を確認</div>
      <div class="card-en"    id="card-en"></div>
      <div class="card-alt"   id="card-alt"></div>
      <div class="card-tip"   id="card-tip"></div>
    </div>

    <div class="act-row">
      <button class="act-btn act-reveal" id="btn-reveal" onclick="revealCard()">英語を見る</button>
      <button class="act-btn act-ok" id="btn-ok" style="display:none" onclick="markOk()">✓ 言えた！</button>
      <button class="act-btn act-ng" id="btn-ng" style="display:none" onclick="markNg()">✕ もう一度</button>
    </div>
    <button class="act-skip" onclick="skipCard()">スキップ →</button>
  </div>

  <div id="result-area" style="display:none">
    <div class="result-box">
      <div class="res-emoji" id="res-emoji">🎉</div>
      <div class="res-title" id="res-title">完了！</div>
      <div class="res-sub"   id="res-sub"></div>
      <div class="res-stats">
        <div class="rs"><div class="rs-n g" id="r-ok">0</div><div class="rs-l">言えた！</div></div>
        <div class="rs"><div class="rs-n r" id="r-ng">0</div><div class="rs-l">もう一度</div></div>
        <div class="rs"><div class="rs-n b" id="r-total">0</div><div class="rs-l">総問数</div></div>
      </div>
      <div class="res-btns">
        <button class="res-btn p" id="r-loop-btn" style="display:none" onclick="startStage3FromResult()">🔁 第3層で身体化する</button>
        <button class="res-btn s" onclick="backToSetup()">もう一度設定から</button>
        <button class="res-btn t" onclick="switchTab('stats',document.querySelectorAll('.tab')[2])">記録を見る</button>
      </div>
    </div>
  </div>
</div>

<!-- ===== GUIDE PAGE ===== -->
<div id="page-guide" class="page">
  <div class="sec" style="margin-top:14px">場面別 フレーズチャンク一覧</div>
  <div class="scene-chips" id="guide-chips"></div>
  <div id="guide-list"></div>
</div>

<!-- ===== STATS PAGE ===== -->
<div id="page-stats" class="page">
  <div class="sec" style="margin-top:14px">全体の進捗</div>
  <div class="overall">
    <div class="os"><div class="os-n gold" id="st-total">0</div><div class="os-l">総フレーズ</div></div>
    <div class="os"><div class="os-n g"    id="st-master">0</div><div class="os-l">完全習得</div></div>
    <div class="os"><div class="os-n b"    id="st-learn">0</div><div class="os-l">学習中</div></div>
  </div>
  <div class="sec">場面別進捗</div>
  <div id="scene-stats"></div>
  <button class="reset-btn" onclick="resetAll()">↺ 全データをリセット</button>
</div>

</main>

<script>
// ============================================================

const SCENES = [...new Set(PHRASES.map(p => p.scene))];
const SCENE_LABELS = {
  leaving:'🚪 外出前', daily:'☀️ 日常', sleep:'🌙 就寝',
  walk:'🦮 散歩', alone:'🏠 留守番'
};
const SCENE_COLORS = {
  leaving:'#c8962a', daily:'#4a7c59', sleep:'#5a2a7a',
  walk:'#3d5a8a', alone:'#a03030'
};

// ── STATE ──
let mastered = new Set(JSON.parse(localStorage.getItem('cr_mastered') || '[]'));
let wrong    = new Set(JSON.parse(localStorage.getItem('cr_wrong')    || '[]'));
let streakMap = {}; // id -> consecutive ok count
const LOOP_TARGET = 5;
let queue=[], qIdx=0, revealed=false;
let currentMode='stage1', selectedScene='all';
let sessionOk=0, sessionNg=0;
let timerInterval=null, timerLeft=3;

function save(){
  localStorage.setItem('cr_mastered', JSON.stringify([...mastered]));
  localStorage.setItem('cr_wrong',    JSON.stringify([...wrong]));
}
function updateHeader(){
  document.getElementById('h-score').textContent = mastered.size;
}

// ── TABS ──
function switchTab(p, btn){
  document.querySelectorAll('.page').forEach(x=>x.classList.remove('active'));
  document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));
  document.getElementById('page-'+p).classList.add('active');
  btn.classList.add('active');
  if(p==='guide') renderGuide();
  if(p==='stats') renderStats();
}

// ── SETUP ──
function initSetup(){
  const sc = document.getElementById('scene-chips');
  sc.innerHTML = `<button class="sc active" onclick="selectScene('all',this)">すべて (${PHRASES.length})</button>`;
  SCENES.forEach(s=>{
    const n = PHRASES.filter(p=>p.scene===s).length;
    sc.innerHTML += `<button class="sc" onclick="selectScene('${s}',this)">${SCENE_LABELS[s]} (${n})</button>`;
  });
}

function selectScene(scene, btn){
  selectedScene = scene;
  document.querySelectorAll('#scene-chips .sc').forEach(c=>c.classList.remove('active'));
  btn.classList.add('active');
}

function selectMode(mode){
  currentMode = mode;
  document.querySelectorAll('.mode-btn').forEach(c=>c.classList.remove('active'));
  document.getElementById('mode-'+mode).classList.add('active');
}

// ── TRAINING ──
function startTraining(){
  let pool = selectedScene==='all' ? [...PHRASES] : PHRASES.filter(p=>p.scene===selectedScene);
  if(currentMode==='stage3'){
    pool = pool.filter(p=>!mastered.has(p.id));
    if(pool.length===0){alert('おめでとうございます！全フレーズ習得済みです🎉');return;}
  }
  // shuffle
  for(let i=pool.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[pool[i],pool[j]]=[pool[j],pool[i]];}
  queue=pool; qIdx=0; sessionOk=0; sessionNg=0; streakMap={};
  document.getElementById('setup-area').style.display='none';
  document.getElementById('result-area').style.display='none';
  document.getElementById('train-area').style.display='block';
  // layer badge
  const labels={'stage1':'⚡ 第1層 — チャンク練習','stage2':'⏱️ 第2層 — タイマー反射','stage3':'🔁 第3層 — 身体化ループ'};
  document.getElementById('layer-badge').textContent = labels[currentMode];
  document.getElementById('timer-area').style.display = currentMode==='stage2'?'block':'none';
  document.getElementById('loop-area').style.display  = currentMode==='stage3'?'block':'none';
  showCard();
}

function showCard(){
  if(qIdx >= queue.length){endTraining();return;}
  const p = queue[qIdx];
  revealed = false;
  const card = document.getElementById('flash-card');
  card.className = 'flash-card';
  document.getElementById('card-scene').textContent = p.sceneLabel;
  document.getElementById('card-sit').textContent   = p.situation;
  document.getElementById('card-jp').textContent    = p.jp;
  document.getElementById('card-en').textContent    = p.en;
  document.getElementById('card-alt').textContent   = p.alt ? '💡 ' + p.alt : '';
  document.getElementById('card-tip').textContent   = p.tip ? '🔑 ' + p.tip : '';
  document.getElementById('btn-reveal').style.display = 'inline-block';
  document.getElementById('btn-ok').style.display = 'none';
  document.getElementById('btn-ng').style.display = 'none';
  // progress
  document.getElementById('t-ctr').textContent = `${qIdx+1} / ${queue.length}`;
  document.getElementById('t-pf').style.width = (qIdx/queue.length*100)+'%';
  // streak dots
  if(currentMode==='stage3'){
    const cnt = streakMap[p.id]||0;
    document.getElementById('loop-left').textContent = LOOP_TARGET-cnt;
    let dots='';
    for(let i=0;i<LOOP_TARGET;i++) dots+=`<div class="streak-dot ${i<cnt?'filled':''}"></div>`;
    document.getElementById('streak-row').innerHTML=dots;
  }
  if(currentMode==='stage2') startTimer();
}

function startTimer(){
  clearInterval(timerInterval); timerLeft=3; updateTimerUI(3,3);
  timerInterval=setInterval(()=>{
    timerLeft-=0.1;
    if(timerLeft<=0){clearInterval(timerInterval);timerLeft=0;revealCard();}
    updateTimerUI(timerLeft,3);
  },100);
}
function updateTimerUI(val,max){
  const offset=188.5*(1-val/max);
  document.getElementById('t-circle').style.strokeDashoffset=offset;
  document.getElementById('t-num').textContent=Math.ceil(val);
  document.getElementById('t-circle').style.stroke=val>2?'#c8962a':val>1?'#c86a2a':'#a03030';
}

function revealCard(){
  if(revealed) return;
  revealed=true;
  clearInterval(timerInterval);
  document.getElementById('flash-card').classList.add('revealed');
  document.getElementById('btn-reveal').style.display='none';
  document.getElementById('btn-ok').style.display='inline-block';
  document.getElementById('btn-ng').style.display='inline-block';
}

function markOk(){
  const p = queue[qIdx];
  sessionOk++;
  wrong.delete(p.id);
  if(currentMode==='stage3'){
    streakMap[p.id] = (streakMap[p.id]||0)+1;
    if(streakMap[p.id]>=LOOP_TARGET){
      mastered.add(p.id); save();
      qIdx++;
    } else {
      const ins = qIdx+1+Math.floor(Math.random()*Math.min(5,queue.length-qIdx-1));
      queue.splice(ins,0,p); qIdx++;
    }
  } else {
    mastered.add(p.id); save(); qIdx++;
  }
  updateHeader(); showCard();
}

function markNg(){
  const p = queue[qIdx];
  sessionNg++; wrong.add(p.id);
  if(currentMode==='stage3'){
    streakMap[p.id]=0;
    const ins=qIdx+1+Math.floor(Math.random()*Math.min(4,queue.length-qIdx-1));
    queue.splice(Math.min(ins,queue.length),0,p);
  }
  save(); qIdx++; showCard();
}

function skipCard(){ qIdx++; showCard(); }

function quitTraining(){
  clearInterval(timerInterval); backToSetup();
}

function endTraining(){
  clearInterval(timerInterval);
  document.getElementById('train-area').style.display='none';
  document.getElementById('result-area').style.display='block';
  const total=sessionOk+sessionNg;
  const pct=total>0?Math.round(sessionOk/total*100):0;
  document.getElementById('r-ok').textContent=sessionOk;
  document.getElementById('r-ng').textContent=sessionNg;
  document.getElementById('r-total').textContent=total;
  document.getElementById('res-emoji').textContent=pct>=80?'🎉':pct>=50?'💪':'🔥';
  document.getElementById('res-title').textContent=pct>=80?'素晴らしい！':pct>=50?'いい調子！':'もう一息！';
  document.getElementById('res-sub').textContent=`正解率 ${pct}% — ${currentMode==='stage3'?'第3層 身体化モード':'完了'}`;
  document.getElementById('r-loop-btn').style.display=sessionNg>0&&currentMode!=='stage3'?'block':'none';
  updateHeader();
}

function startStage3FromResult(){
  currentMode='stage3';
  const ng=[...wrong];
  if(ng.length===0){alert('間違えたフレーズがありません！');return;}
  queue=PHRASES.filter(p=>ng.includes(p.id));
  for(let i=queue.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[queue[i],queue[j]]=[queue[j],queue[i]];}
  qIdx=0; sessionOk=0; sessionNg=0; streakMap={};
  document.getElementById('result-area').style.display='none';
  document.getElementById('train-area').style.display='block';
  document.getElementById('layer-badge').textContent='🔁 第3層 — 身体化ループ';
  document.getElementById('timer-area').style.display='none';
  document.getElementById('loop-area').style.display='block';
  showCard();
}

function backToSetup(){
  document.getElementById('train-area').style.display='none';
  document.getElementById('result-area').style.display='none';
  document.getElementById('setup-area').style.display='block';
}

// ── GUIDE ──
function renderGuide(){
  const gc=document.getElementById('guide-chips');
  gc.innerHTML=`<button class="sc active" onclick="filterGuide('all',this)">すべて</button>`;
  SCENES.forEach(s=>{gc.innerHTML+=`<button class="sc" onclick="filterGuide('${s}',this)">${SCENE_LABELS[s]}</button>`;});
  filterGuide('all', gc.firstElementChild);
}

function filterGuide(scene, btn){
  document.querySelectorAll('#guide-chips .sc').forEach(c=>c.classList.remove('active'));
  btn.classList.add('active');
  const pool = scene==='all' ? PHRASES : PHRASES.filter(p=>p.scene===scene);
  // group by scene
  const groups={};
  pool.forEach(p=>{ if(!groups[p.scene]) groups[p.scene]=[]; groups[p.scene].push(p); });
  let html='';
  Object.keys(groups).forEach(sc=>{
    const items=groups[sc];
    html+=`<div class="scene-guide">
      <div class="sg-hd">
        <span class="sg-title">${SCENE_LABELS[sc]}</span>
        <span class="sg-count">${items.length}フレーズ</span>
      </div>
      <div class="sg-body">
        ${items.map((p,i)=>`
          <div class="chunk-item">
            <div class="chunk-num">${i+1}</div>
            <div class="chunk-content">
              <div class="chunk-jp">${p.jp}</div>
              <div class="chunk-en">${p.en}</div>
              <span class="chunk-tip">${p.situation}</span>
            </div>
            <div class="chunk-done ${mastered.has(p.id)?'show':''}">✓</div>
          </div>`).join('')}
      </div>
    </div>`;
  });
  document.getElementById('guide-list').innerHTML=html;
}

// ── STATS ──
function renderStats(){
  document.getElementById('st-total').textContent=PHRASES.length;
  document.getElementById('st-master').textContent=mastered.size;
  document.getElementById('st-learn').textContent=PHRASES.length-mastered.size;
  document.getElementById('scene-stats').innerHTML=SCENES.map(s=>{
    const total=PHRASES.filter(p=>p.scene===s).length;
    const done=PHRASES.filter(p=>p.scene===s&&mastered.has(p.id)).length;
    const pct=Math.round(done/total*100);
    return `<div class="scene-stat">
      <div class="ss-top">
        <span class="ss-name">${SCENE_LABELS[s]}</span>
        <span class="ss-pct">${done}/${total} (${pct}%)</span>
      </div>
      <div class="ss-bar">
        <div class="ss-fill" style="width:${pct}%;background:${SCENE_COLORS[s]||'var(--moss)'}"></div>
      </div>
    </div>`;
  }).join('');
}

function resetAll(){
  if(!confirm('全データをリセットしますか？'))return;
  mastered.clear(); wrong.clear(); save();
  updateHeader(); renderStats();
}

// INIT
initSetup(); updateHeader();
</script>
