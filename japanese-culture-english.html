<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Japanese Culture English — 日本文化英語カード</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Noto+Serif+JP:wght@300;400;600&family=Playfair+Display:ital,wght@0,400;0,600;1,400&family=Inter:wght@300;400;500&display=swap');

  :root {
    --ink: #1a1208;
    --ash: #4a3f2f;
    --mist: #8a7d6a;
    --paper: #faf7f0;
    --parchment: #f0ebe0;
    --stone: #d8d0c0;
    --sakura: #c87070;
    --sakura-light: #e09090;
    --matcha: #5a7058;
    --matcha-light: #7a9478;
    --gold: #a07830;
    --gold-light: #c8a050;
    --indigo: #3a4870;
    --correct: #5a7a5a;
    --incorrect: #8b4a4a;
    --shadow: rgba(26,18,8,0.12);
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: 'Inter', sans-serif;
    background: var(--paper);
    color: var(--ink);
    min-height: 100vh;
    display: flex;
    flex-direction: column;
  }

  /* ── Header ── */
  .header {
    background: var(--ink);
    padding: 18px 24px 14px;
    display: flex;
    align-items: center;
    gap: 16px;
    position: relative;
    overflow: hidden;
  }
  .header::after {
    content: '日本文化';
    position: absolute;
    right: 20px;
    top: 50%;
    transform: translateY(-50%);
    font-family: 'Noto Serif JP', serif;
    font-size: 32px;
    color: rgba(255,255,255,0.06);
    font-weight: 600;
    letter-spacing: 0.1em;
    pointer-events: none;
  }
  .header-icon { font-size: 24px; }
  .header-titles { display: flex; flex-direction: column; gap: 2px; }
  .header-title {
    font-family: 'Playfair Display', serif;
    font-size: 20px;
    color: var(--paper);
    letter-spacing: 0.03em;
  }
  .header-sub {
    font-family: 'Noto Serif JP', serif;
    font-size: 10px;
    color: var(--mist);
    letter-spacing: 0.1em;
  }

  /* ── Category tabs ── */
  .cat-bar {
    background: var(--parchment);
    border-bottom: 1px solid var(--stone);
    padding: 10px 16px;
    display: flex;
    gap: 6px;
    overflow-x: auto;
    scrollbar-width: none;
  }
  .cat-bar::-webkit-scrollbar { display: none; }
  .cat-tab {
    padding: 5px 12px;
    border-radius: 20px;
    border: 1.5px solid var(--stone);
    background: transparent;
    font-size: 11px;
    color: var(--ash);
    cursor: pointer;
    white-space: nowrap;
    font-family: 'Noto Serif JP', serif;
    transition: all 0.2s;
    flex-shrink: 0;
  }
  .cat-tab:hover { border-color: var(--sakura); color: var(--sakura); }
  .cat-tab.active { background: var(--ink); border-color: var(--ink); color: var(--paper); }

  /* ── Stats bar ── */
  .stats-bar {
    padding: 8px 20px;
    display: flex;
    gap: 18px;
    align-items: center;
    border-bottom: 1px solid var(--stone);
    flex-wrap: wrap;
  }
  .stat { display: flex; align-items: center; gap: 5px; font-size: 11px; color: var(--ash); }
  .stat-dot { width: 7px; height: 7px; border-radius: 50%; }
  .dot-total { background: var(--stone); }
  .dot-correct { background: var(--correct); }
  .dot-incorrect { background: var(--incorrect); }
  .dot-remaining { background: var(--gold); }

  /* ── Mode bar ── */
  .mode-bar {
    padding: 10px 20px;
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
    align-items: center;
    border-bottom: 1px solid var(--stone);
  }
  .mode-label { font-size: 10px; color: var(--mist); letter-spacing: 0.08em; margin-right: 2px; }
  .mode-btn {
    padding: 4px 12px;
    border-radius: 20px;
    border: 1.5px solid var(--stone);
    background: transparent;
    font-size: 11px;
    color: var(--ash);
    cursor: pointer;
    font-family: 'Inter', sans-serif;
    transition: all 0.2s;
  }
  .mode-btn:hover { border-color: var(--sakura); color: var(--sakura); }
  .mode-btn.active { background: var(--ink); border-color: var(--ink); color: var(--paper); }
  .dir-toggle {
    margin-left: auto;
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 11px;
    color: var(--ash);
  }
  .toggle-switch { position: relative; width: 44px; height: 22px; }
  .toggle-switch input { opacity: 0; width: 0; height: 0; }
  .toggle-slider {
    position: absolute; inset: 0;
    background: var(--stone);
    border-radius: 11px;
    cursor: pointer;
    transition: 0.3s;
  }
  .toggle-slider::before {
    content: '';
    position: absolute;
    width: 16px; height: 16px;
    left: 3px; top: 3px;
    background: white;
    border-radius: 50%;
    transition: 0.3s;
  }
  input:checked + .toggle-slider { background: var(--matcha); }
  input:checked + .toggle-slider::before { transform: translateX(22px); }

  /* ── Main ── */
  main {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 28px 20px 24px;
    gap: 22px;
  }

  .progress-wrap {
    width: 100%; max-width: 640px;
    display: flex;
    align-items: center;
    gap: 12px;
  }
  .progress-bar {
    flex: 1;
    height: 3px;
    background: var(--stone);
    border-radius: 2px;
    overflow: hidden;
  }
  .progress-fill {
    height: 100%;
    background: var(--sakura);
    border-radius: 2px;
    transition: width 0.4s ease;
  }
  .progress-text { font-size: 11px; color: var(--mist); white-space: nowrap; }

  /* ── Card ── */
  .card-scene {
    width: 100%; max-width: 640px;
    perspective: 1200px;
  }
  .card {
    width: 100%;
    min-height: 300px;
    position: relative;
    transform-style: preserve-3d;
    transition: transform 0.55s cubic-bezier(0.4,0,0.2,1);
    cursor: pointer;
  }
  .card.flipped { transform: rotateY(180deg); }
  .card-face {
    position: absolute; inset: 0;
    backface-visibility: hidden;
    -webkit-backface-visibility: hidden;
    border-radius: 4px;
    padding: 36px 44px;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    text-align: center;
    box-shadow: 0 2px 16px var(--shadow), 0 0 0 1px var(--stone);
  }
  .card-front { background: var(--paper); }
  .card-back { background: var(--ink); transform: rotateY(180deg); }

  /* culture motif on card */
  .card-front::before {
    content: attr(data-motif);
    position: absolute;
    bottom: 12px;
    right: 18px;
    font-size: 36px;
    opacity: 0.06;
    pointer-events: none;
  }

  .cat-badge {
    position: absolute;
    top: 14px; left: 18px;
    font-size: 10px;
    color: var(--mist);
    letter-spacing: 0.08em;
    font-family: 'Inter', sans-serif;
  }
  .level-badge {
    position: absolute;
    top: 14px; right: 18px;
    font-size: 9px;
    color: var(--sakura);
    letter-spacing: 0.1em;
    border: 1px solid rgba(200,112,112,0.3);
    padding: 2px 6px;
    border-radius: 10px;
  }
  .card-lang {
    font-size: 9px;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    margin-bottom: 14px;
    opacity: 0.4;
    font-family: 'Inter', sans-serif;
  }
  .card-front .card-lang { color: var(--ink); }
  .card-back .card-lang { color: var(--paper); }

  .card-text {
    font-family: 'Playfair Display', serif;
    font-size: clamp(15px, 2.8vw, 20px);
    line-height: 1.65;
    font-weight: 400;
  }
  .card-front .card-text { color: var(--ink); }
  .card-back .card-text { color: var(--paper); }

  .card-sub {
    margin-top: 12px;
    font-family: 'Noto Serif JP', serif;
    font-size: clamp(12px, 2vw, 14px);
    line-height: 1.9;
    opacity: 0.55;
  }
  .card-front .card-sub { color: var(--ash); }
  .card-back .card-sub { color: var(--paper); }

  .card-tip {
    margin-top: 16px;
    padding: 8px 14px;
    background: rgba(160,120,48,0.15);
    border-radius: 3px;
    font-size: 11px;
    color: var(--gold-light);
    font-family: 'Inter', sans-serif;
    line-height: 1.6;
    max-width: 420px;
    text-align: center;
  }
  .card-hint {
    margin-top: 24px;
    font-size: 10px;
    color: var(--mist);
    letter-spacing: 0.06em;
    display: flex;
    align-items: center;
    gap: 5px;
  }
  .card-back .card-hint { color: rgba(255,255,255,0.25); }

  /* ── Actions ── */
  .actions {
    display: flex;
    gap: 10px;
    width: 100%; max-width: 640px;
    justify-content: center;
    flex-wrap: wrap;
  }
  .btn {
    padding: 10px 22px;
    border-radius: 3px;
    border: none;
    font-size: 13px;
    font-family: 'Inter', sans-serif;
    cursor: pointer;
    transition: all 0.2s;
    letter-spacing: 0.03em;
    font-weight: 500;
  }
  .btn-correct { background: var(--correct); color: white; flex: 1; max-width: 190px; }
  .btn-incorrect { background: var(--incorrect); color: white; flex: 1; max-width: 190px; }
  .btn-skip { background: transparent; color: var(--mist); border: 1.5px solid var(--stone); }
  .btn:hover { opacity: 0.85; transform: translateY(-1px); }
  .btn:active { transform: translateY(0); }
  .btn:disabled { opacity: 0.3; cursor: not-allowed; transform: none; }
  .nav-btns { display: flex; gap: 8px; align-items: center; }
  .nav-btn {
    width: 36px; height: 36px;
    border-radius: 50%;
    border: 1.5px solid var(--stone);
    background: transparent;
    cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    font-size: 14px;
    color: var(--ash);
    transition: all 0.2s;
  }
  .nav-btn:hover { border-color: var(--ink); color: var(--ink); }
  .nav-btn:disabled { opacity: 0.3; cursor: not-allowed; }

  /* ── Review panel ── */
  .review-panel {
    width: 100%; max-width: 640px;
    background: var(--parchment);
    border: 1px solid var(--stone);
    border-radius: 4px;
    padding: 14px 18px;
  }
  .review-title {
    font-size: 10px;
    letter-spacing: 0.08em;
    color: var(--mist);
    margin-bottom: 10px;
    text-transform: uppercase;
  }
  .review-chips { display: flex; gap: 6px; flex-wrap: wrap; }
  .review-chip {
    padding: 3px 9px;
    border-radius: 10px;
    font-size: 11px;
    border: none;
    cursor: pointer;
    transition: opacity 0.2s;
    font-family: 'Noto Serif JP', serif;
  }
  .review-chip:hover { opacity: 0.75; }
  .chip-correct { background: rgba(90,122,90,0.12); color: var(--correct); }
  .chip-incorrect { background: rgba(139,74,74,0.12); color: var(--incorrect); }

  /* ── Completion ── */
  .completion {
    text-align: center;
    padding: 48px 24px;
    max-width: 480px;
  }
  .completion-icon { font-size: 48px; margin-bottom: 20px; }
  .completion-title {
    font-family: 'Playfair Display', serif;
    font-size: 26px;
    margin-bottom: 10px;
    color: var(--ink);
  }
  .completion-sub {
    font-family: 'Noto Serif JP', serif;
    font-size: 13px;
    color: var(--ash);
    line-height: 2;
    margin-bottom: 28px;
  }
  .completion-btns { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; }
  .btn-restart { background: var(--ink); color: var(--paper); padding: 11px 28px; }
  .btn-review-only {
    background: transparent;
    color: var(--incorrect);
    border: 1.5px solid var(--incorrect);
    padding: 11px 28px;
  }

  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(8px); }
    to { opacity: 1; transform: translateY(0); }
  }
  .card-scene { animation: fadeUp 0.3s ease; }

  @media (max-width: 480px) {
    .card-face { padding: 28px 22px; }
    .header { padding: 14px 16px 12px; }
    main { padding: 18px 14px; }
    .dir-toggle { margin-left: 0; width: 100%; }
  }
</style>
</head>
<body>

<div class="header">
  <div class="header-icon">⛩️</div>
  <div class="header-titles">
    <div class="header-title">Japanese Culture English</div>
    <div class="header-sub">日本の美しい文化 — 英検2・3級レベル</div>
  </div>
</div>

<!-- Category tabs -->
<div class="cat-bar" id="catBar">
  <button class="cat-tab active" onclick="filterCat('all', this)">すべて</button>
  <button class="cat-tab" onclick="filterCat('整列文化', this)">🚃 整列</button>
  <button class="cat-tab" onclick="filterCat('おもてなし', this)">🍵 おもてなし</button>
  <button class="cat-tab" onclick="filterCat('時間厳守', this)">⏰ 時間厳守</button>
  <button class="cat-tab" onclick="filterCat('食の作法', this)">🍱 食の作法</button>
  <button class="cat-tab" onclick="filterCat('落とし物', this)">💼 落とし物</button>
  <button class="cat-tab" onclick="filterCat('公共マナー', this)">🚇 公共マナー</button>
  <button class="cat-tab" onclick="filterCat('掃除文化', this)">🧹 掃除文化</button>
  <button class="cat-tab" onclick="filterCat('贈り物', this)">🎁 贈り物</button>
  <button class="cat-tab" onclick="filterCat('謙虚さ', this)">🙏 謙虚さ</button>
  <button class="cat-tab" onclick="filterCat('自然への敬意', this)">🌸 自然への敬意</button>
</div>

<div class="stats-bar">
  <div class="stat"><span class="stat-dot dot-total"></span><span id="statTotal">0 cards</span></div>
  <div class="stat"><span class="stat-dot dot-correct"></span><span id="statCorrect">0 correct</span></div>
  <div class="stat"><span class="stat-dot dot-incorrect"></span><span id="statIncorrect">0 incorrect</span></div>
  <div class="stat"><span class="stat-dot dot-remaining"></span><span id="statRemaining">0 remaining</span></div>
</div>

<div class="mode-bar">
  <span class="mode-label">MODE</span>
  <button class="mode-btn active" onclick="setMode('all', this)">All Cards</button>
  <button class="mode-btn" onclick="setMode('incorrect', this)">Incorrect Only</button>
  <button class="mode-btn" onclick="setMode('random', this)">Random</button>
  <div class="dir-toggle">
    <span>EN → JP</span>
    <label class="toggle-switch">
      <input type="checkbox" id="dirToggle" onchange="toggleDirection()">
      <span class="toggle-slider"></span>
    </label>
    <span>JP → EN</span>
  </div>
</div>

<main id="mainContent"></main>

let state = {
  mode: 'all',
  direction: 'en-jp',
  catFilter: 'all',
  queue: [],
  currentIndex: 0,
  isFlipped: false,
  correct: new Set(),
  incorrect: new Set(),
  done: false,
};

function loadStorage() {
  try {
    const saved = localStorage.getItem(STORAGE_KEY);
    if (saved) {
      const d = JSON.parse(saved);
      state.correct = new Set(d.correct || []);
      state.incorrect = new Set(d.incorrect || []);
    }
  } catch(e) {}
}

function saveStorage() {
  localStorage.setItem(STORAGE_KEY, JSON.stringify({
    correct: [...state.correct],
    incorrect: [...state.incorrect],
  }));
}

function getPool() {
  let pool = state.catFilter === 'all' ? [...CARDS] : CARDS.filter(c => c.cat === state.catFilter);
  if (state.mode === 'incorrect') {
    const filtered = pool.filter(c => state.incorrect.has(c.id));
    pool = filtered.length > 0 ? filtered : pool;
  }
  if (state.mode === 'random') pool = shuffle(pool);
  return pool;
}

function buildQueue() {
  state.queue = getPool();
  state.currentIndex = 0;
  state.isFlipped = false;
  state.done = false;
}

function shuffle(arr) {
  const a = [...arr];
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

function filterCat(cat, el) {
  state.catFilter = cat;
  document.querySelectorAll('.cat-tab').forEach(b => b.classList.remove('active'));
  el.classList.add('active');
  buildQueue();
  render();
}

function setMode(m, el) {
  state.mode = m;
  document.querySelectorAll('.mode-btn').forEach(b => b.classList.remove('active'));
  el.classList.add('active');
  buildQueue();
  render();
}

function toggleDirection() {
  state.direction = document.getElementById('dirToggle').checked ? 'jp-en' : 'en-jp';
  state.isFlipped = false;
  render();
}

function flipCard() {
  state.isFlipped = !state.isFlipped;
  render();
}

function markCorrect() {
  const card = state.queue[state.currentIndex];
  state.correct.add(card.id);
  state.incorrect.delete(card.id);
  saveStorage();
  nextCard();
}

function markIncorrect() {
  const card = state.queue[state.currentIndex];
  state.incorrect.add(card.id);
  saveStorage();
  nextCard();
}

function nextCard() {
  if (state.currentIndex < state.queue.length - 1) {
    state.currentIndex++;
    state.isFlipped = false;
    render();
  } else {
    state.done = true;
    render();
  }
}

function prevCard() {
  if (state.currentIndex > 0) {
    state.currentIndex--;
    state.isFlipped = false;
    render();
  }
}

function jumpTo(id) {
  const idx = state.queue.findIndex(c => c.id === id);
  if (idx >= 0) {
    state.currentIndex = idx;
    state.isFlipped = false;
    state.done = false;
    render();
  }
}

function restartAll() {
  state.mode = 'all';
  state.catFilter = 'all';
  document.querySelectorAll('.mode-btn').forEach((b,i) => b.classList.toggle('active', i===0));
  document.querySelectorAll('.cat-tab').forEach((b,i) => b.classList.toggle('active', i===0));
  buildQueue();
  render();
}

function restartIncorrect() {
  state.mode = 'incorrect';
  document.querySelectorAll('.mode-btn').forEach((b,i) => b.classList.toggle('active', i===1));
  buildQueue();
  render();
}

function updateStats() {
  document.getElementById('statTotal').textContent = `${state.queue.length} cards`;
  document.getElementById('statCorrect').textContent = `${state.correct.size} correct`;
  document.getElementById('statIncorrect').textContent = `${state.incorrect.size} incorrect`;
  const remaining = state.queue.length - state.currentIndex - (state.done ? 0 : 1);
  document.getElementById('statRemaining').textContent = `${Math.max(0, remaining)} remaining`;
}

function render() {
  updateStats();
  const main = document.getElementById('mainContent');

  if (state.done) {
    const inc = [...state.incorrect].filter(id =>
      state.queue.some(c => c.id === id)
    ).length;
    main.innerHTML = `
      <div class="completion">
        <div class="completion-icon">🌸</div>
        <div class="completion-title">Session Complete</div>
        <div class="completion-sub">
          ${state.queue.length} cards reviewed<br>
          ${state.correct.size} correct · ${state.incorrect.size} to review<br>
          <br>よく頑張りました！
        </div>
        <div class="completion-btns">
          <button class="btn btn-restart" onclick="restartAll()">Start Over</button>
          ${inc > 0 ? `<button class="btn btn-review-only" onclick="restartIncorrect()">Review ${inc} Missed</button>` : ''}
        </div>
      </div>`;
    return;
  }

  const card = state.queue[state.currentIndex];
  const progress = (state.currentIndex / state.queue.length * 100).toFixed(1);

  const frontText = state.direction === 'en-jp' ? card.en : card.jp;
  const backText  = state.direction === 'en-jp' ? card.jp : card.en;
  const frontLang = state.direction === 'en-jp' ? 'English' : '日本語';
  const backLang  = state.direction === 'en-jp' ? '日本語' : 'English';

  const statusDot = state.correct.has(card.id) ? '🟢' : state.incorrect.has(card.id) ? '🔴' : '';
  const tipHtml = card.tip ? `<div class="card-tip">💡 ${card.tip}</div>` : '';

  main.innerHTML = `
    <div class="progress-wrap">
      <div class="progress-bar"><div class="progress-fill" style="width:${progress}%"></div></div>
      <div class="progress-text">${state.currentIndex + 1} / ${state.queue.length}</div>
    </div>

    <div class="card-scene">
      <div class="card ${state.isFlipped ? 'flipped' : ''}" onclick="flipCard()">
        <div class="card-face card-front" data-motif="${card.motif}">
          <div class="cat-badge">${card.cat} ${statusDot}</div>
          <div class="level-badge">${card.level}</div>
          <div class="card-lang">${frontLang}</div>
          <div class="card-text">${frontText}</div>
          <div class="card-hint">↕ tap to flip</div>
        </div>
        <div class="card-face card-back">
          <div class="cat-badge">${card.cat}</div>
          <div class="card-lang">${backLang}</div>
          <div class="card-text">${backText}</div>
          ${tipHtml}
          <div class="card-hint">↕ tap to flip back</div>
        </div>
      </div>
    </div>

    <div class="actions">
      <div class="nav-btns">
        <button class="nav-btn" onclick="prevCard()" ${state.currentIndex===0?'disabled':''}>←</button>
      </div>
      <button class="btn btn-incorrect" onclick="markIncorrect()" ${!state.isFlipped?'disabled':''}>✗ Missed</button>
      <button class="btn btn-correct" onclick="markCorrect()" ${!state.isFlipped?'disabled':''}>✓ Got it</button>
      <div class="nav-btns">
        <button class="nav-btn" onclick="nextCard()">→</button>
      </div>
    </div>

    <div class="review-panel">
      <div class="review-title">Completed in this session</div>
      <div class="review-chips">
        ${[...state.correct].slice(-10).map(id => {
          const c = CARDS.find(x=>x.id===id);
          return c ? `<button class="review-chip chip-correct" onclick="jumpTo(${c.id})" title="${c.en}">${c.cat}</button>` : '';
        }).join('')}
        ${[...state.incorrect].slice(-10).map(id => {
          const c = CARDS.find(x=>x.id===id);
          return c ? `<button class="review-chip chip-incorrect" onclick="jumpTo(${c.id})" title="${c.en}">${c.cat}</button>` : '';
        }).join('')}
        ${state.correct.size + state.incorrect.size === 0 ? '<span style="font-size:11px;color:var(--mist)">カードをめくって記録しよう</span>' : ''}
      </div>
    </div>`;
}

loadStorage();
buildQueue();
render();
</script>
