<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>孤独の知恵 — 英語暗記カード</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Noto+Serif+JP:wght@300;400;600&family=Playfair+Display:ital,wght@0,400;0,600;1,400&family=Inter:wght@300;400;500&display=swap');

  :root {
    --ink: #1a1a1a;
    --ash: #4a4a4a;
    --mist: #8a8a8a;
    --paper: #f7f4ef;
    --parchment: #ede9e1;
    --stone: #d4cfc6;
    --moss: #5c6b5a;
    --moss-light: #7a8f77;
    --gold: #a08040;
    --gold-light: #c9a862;
    --correct: #4a7c5a;
    --incorrect: #8b4a4a;
    --shadow: rgba(26,26,26,0.12);
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: 'Inter', sans-serif;
    background: var(--paper);
    color: var(--ink);
    min-height: 100vh;
    display: flex;
    flex-direction: column;
  }

  /* Header */
  .header {
    background: var(--ink);
    padding: 20px 24px 16px;
    display: flex;
    align-items: baseline;
    gap: 16px;
  }
  .header-title {
    font-family: 'Playfair Display', serif;
    font-size: 22px;
    color: var(--paper);
    letter-spacing: 0.02em;
  }
  .header-sub {
    font-family: 'Noto Serif JP', serif;
    font-size: 11px;
    color: var(--mist);
    letter-spacing: 0.08em;
  }

  /* Stats bar */
  .stats-bar {
    background: var(--parchment);
    border-bottom: 1px solid var(--stone);
    padding: 10px 24px;
    display: flex;
    gap: 20px;
    align-items: center;
    flex-wrap: wrap;
  }
  .stat {
    display: flex;
    align-items: center;
    gap: 6px;
    font-size: 12px;
    color: var(--ash);
  }
  .stat-dot {
    width: 8px; height: 8px; border-radius: 50%;
  }
  .dot-total { background: var(--stone); }
  .dot-correct { background: var(--correct); }
  .dot-incorrect { background: var(--incorrect); }
  .dot-remaining { background: var(--gold); }

  /* Mode selector */
  .mode-bar {
    padding: 12px 24px;
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
    align-items: center;
    border-bottom: 1px solid var(--stone);
  }
  .mode-label {
    font-size: 11px;
    color: var(--mist);
    letter-spacing: 0.06em;
    margin-right: 4px;
  }
  .mode-btn {
    padding: 5px 14px;
    border-radius: 20px;
    border: 1.5px solid var(--stone);
    background: transparent;
    font-size: 12px;
    color: var(--ash);
    cursor: pointer;
    font-family: 'Inter', sans-serif;
    transition: all 0.2s;
  }
  .mode-btn:hover { border-color: var(--gold); color: var(--gold); }
  .mode-btn.active {
    background: var(--ink);
    border-color: var(--ink);
    color: var(--paper);
  }

  /* Direction toggle */
  .dir-toggle {
    margin-left: auto;
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 11px;
    color: var(--ash);
  }
  .toggle-switch {
    position: relative;
    width: 48px; height: 24px;
  }
  .toggle-switch input { opacity: 0; width: 0; height: 0; }
  .toggle-slider {
    position: absolute; inset: 0;
    background: var(--stone);
    border-radius: 12px;
    cursor: pointer;
    transition: 0.3s;
  }
  .toggle-slider::before {
    content: '';
    position: absolute;
    width: 18px; height: 18px;
    left: 3px; top: 3px;
    background: white;
    border-radius: 50%;
    transition: 0.3s;
  }
  input:checked + .toggle-slider { background: var(--moss); }
  input:checked + .toggle-slider::before { transform: translateX(24px); }

  /* Main */
  main {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 32px 24px 24px;
    gap: 24px;
  }

  /* Progress */
  .progress-wrap {
    width: 100%; max-width: 640px;
    display: flex;
    align-items: center;
    gap: 12px;
  }
  .progress-bar {
    flex: 1;
    height: 3px;
    background: var(--stone);
    border-radius: 2px;
    overflow: hidden;
  }
  .progress-fill {
    height: 100%;
    background: var(--gold);
    border-radius: 2px;
    transition: width 0.4s ease;
  }
  .progress-text {
    font-size: 12px;
    color: var(--mist);
    white-space: nowrap;
  }

  /* Card */
  .card-scene {
    width: 100%; max-width: 640px;
    perspective: 1200px;
  }
  .card {
    width: 100%;
    min-height: 260px;
    position: relative;
    transform-style: preserve-3d;
    transition: transform 0.55s cubic-bezier(0.4,0,0.2,1);
    cursor: pointer;
  }
  .card.flipped { transform: rotateY(180deg); }

  .card-face {
    position: absolute; inset: 0;
    backface-visibility: hidden;
    -webkit-backface-visibility: hidden;
    border-radius: 4px;
    padding: 40px 48px;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    text-align: center;
    box-shadow: 0 2px 12px var(--shadow), 0 0 0 1px var(--stone);
  }
  .card-front { background: var(--paper); }
  .card-back {
    background: var(--ink);
    transform: rotateY(180deg);
  }

  .card-lang {
    font-size: 10px;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    margin-bottom: 20px;
    opacity: 0.45;
    font-family: 'Inter', sans-serif;
  }
  .card-front .card-lang { color: var(--ink); }
  .card-back .card-lang { color: var(--paper); }

  .card-text {
    font-family: 'Playfair Display', serif;
    font-size: clamp(18px, 3.5vw, 26px);
    line-height: 1.55;
    font-weight: 400;
  }
  .card-front .card-text { color: var(--ink); }
  .card-back .card-text { color: var(--paper); }

  .card-sub {
    margin-top: 16px;
    font-family: 'Noto Serif JP', serif;
    font-size: clamp(14px, 2.5vw, 17px);
    line-height: 1.7;
    opacity: 0.6;
  }
  .card-front .card-sub { color: var(--ash); }
  .card-back .card-sub { color: var(--paper); }

  .card-hint {
    margin-top: 32px;
    font-size: 11px;
    color: var(--mist);
    letter-spacing: 0.05em;
    display: flex;
    align-items: center;
    gap: 6px;
  }
  .card-back .card-hint { color: rgba(255,255,255,0.3); }
  .hint-icon { font-size: 14px; }

  /* Category badge */
  .cat-badge {
    position: absolute;
    top: 16px; left: 20px;
    font-size: 10px;
    color: var(--mist);
    letter-spacing: 0.08em;
    font-family: 'Inter', sans-serif;
    opacity: 0.6;
  }

  /* Action buttons */
  .actions {
    display: flex;
    gap: 12px;
    width: 100%; max-width: 640px;
    justify-content: center;
    flex-wrap: wrap;
  }
  .btn {
    padding: 10px 24px;
    border-radius: 3px;
    border: none;
    font-size: 13px;
    font-family: 'Inter', sans-serif;
    cursor: pointer;
    transition: all 0.2s;
    letter-spacing: 0.03em;
    font-weight: 500;
  }
  .btn-correct {
    background: var(--correct);
    color: white;
    flex: 1; max-width: 200px;
  }
  .btn-incorrect {
    background: var(--incorrect);
    color: white;
    flex: 1; max-width: 200px;
  }
  .btn-skip {
    background: transparent;
    color: var(--mist);
    border: 1.5px solid var(--stone);
  }
  .btn:hover { opacity: 0.85; transform: translateY(-1px); }
  .btn:active { transform: translateY(0); }
  .btn:disabled { opacity: 0.3; cursor: not-allowed; transform: none; }

  /* Nav */
  .nav-btns {
    display: flex;
    gap: 8px;
    align-items: center;
  }
  .nav-btn {
    width: 36px; height: 36px;
    border-radius: 50%;
    border: 1.5px solid var(--stone);
    background: transparent;
    cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    font-size: 14px;
    color: var(--ash);
    transition: all 0.2s;
  }
  .nav-btn:hover { border-color: var(--ink); color: var(--ink); }

  /* Review panel */
  .review-panel {
    width: 100%; max-width: 640px;
    background: var(--parchment);
    border: 1px solid var(--stone);
    border-radius: 4px;
    padding: 16px 20px;
  }
  .review-title {
    font-size: 11px;
    letter-spacing: 0.08em;
    color: var(--mist);
    margin-bottom: 10px;
    text-transform: uppercase;
  }
  .review-chips {
    display: flex;
    gap: 6px;
    flex-wrap: wrap;
  }
  .review-chip {
    padding: 4px 10px;
    border-radius: 12px;
    font-size: 11px;
    border: none;
    cursor: pointer;
    transition: opacity 0.2s;
    font-family: 'Inter', sans-serif;
  }
  .review-chip:hover { opacity: 0.75; }
  .chip-correct { background: rgba(74,124,90,0.12); color: var(--correct); }
  .chip-incorrect { background: rgba(139,74,74,0.12); color: var(--incorrect); }

  /* Completion */
  .completion {
    text-align: center;
    padding: 48px 24px;
    max-width: 480px;
  }
  .completion-icon { font-size: 48px; margin-bottom: 20px; }
  .completion-title {
    font-family: 'Playfair Display', serif;
    font-size: 28px;
    margin-bottom: 12px;
    color: var(--ink);
  }
  .completion-sub {
    font-family: 'Noto Serif JP', serif;
    font-size: 14px;
    color: var(--ash);
    line-height: 1.8;
    margin-bottom: 28px;
  }
  .completion-btns {
    display: flex; gap: 10px; justify-content: center; flex-wrap: wrap;
  }
  .btn-restart {
    background: var(--ink);
    color: var(--paper);
    padding: 11px 28px;
  }
  .btn-review-only {
    background: transparent;
    color: var(--incorrect);
    border: 1.5px solid var(--incorrect);
    padding: 11px 28px;
  }

  /* Animations */
  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(8px); }
    to { opacity: 1; transform: translateY(0); }
  }
  .card-scene { animation: fadeUp 0.3s ease; }

  @media (max-width: 480px) {
    .card-face { padding: 28px 24px; }
    .header { padding: 14px 16px 12px; }
    .header-title { font-size: 18px; }
    .stats-bar, .mode-bar { padding: 10px 16px; }
    main { padding: 20px 16px; }
    .dir-toggle { margin-left: 0; width: 100%; }
  }
</style>
</head>

<div class="header">

</div>

<div class="stats-bar">

  <div class="stat"><span class="stat-dot dot-remaining"></span><span id="statRemaining">0 remaining</span></div>
</div>

<div class="mode-bar">

</div>

<main id="mainContent">

</main>

// State
let state = {
  mode: 'all',
  direction: 'en-jp', // 'en-jp' or 'jp-en'
  queue: [],
  currentIndex: 0,
  isFlipped: false,
  correct: new Set(),
  incorrect: new Set(),
  done: false,
};

function loadStorage() {
  try {
    const saved = localStorage.getItem(STORAGE_KEY);
    if (saved) {
      const d = JSON.parse(saved);
      state.correct = new Set(d.correct || []);
      state.incorrect = new Set(d.incorrect || []);
    }
  } catch(e) {}
}

function saveStorage() {
  localStorage.setItem(STORAGE_KEY, JSON.stringify({
    correct: [...state.correct],
    incorrect: [...state.incorrect],
  }));
}

function buildQueue() {
  let pool;
  if (state.mode === 'incorrect') {
    pool = CARDS.filter(c => state.incorrect.has(c.id));
    if (pool.length === 0) pool = [...CARDS];
  } else {
    pool = [...CARDS];
  }
  if (state.mode === 'random') {
    pool = shuffle(pool);
  }
  state.queue = pool;
  state.currentIndex = 0;
  state.isFlipped = false;
  state.done = false;
}

function shuffle(arr) {
  const a = [...arr];
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

function setMode(m) {
  state.mode = m;
  document.querySelectorAll('.mode-btn').forEach(b => b.classList.remove('active'));
  event.target.classList.add('active');
  buildQueue();
  render();
}

function toggleDirection() {
  state.direction = document.getElementById('dirToggle').checked ? 'jp-en' : 'en-jp';
  state.isFlipped = false;
  render();
}

function flipCard() {
  state.isFlipped = !state.isFlipped;
  render();
}

function markCorrect() {
  const card = state.queue[state.currentIndex];
  state.correct.add(card.id);
  state.incorrect.delete(card.id);
  saveStorage();
  nextCard();
}

function markIncorrect() {
  const card = state.queue[state.currentIndex];
  state.incorrect.add(card.id);
  saveStorage();
  nextCard();
}

function nextCard() {
  if (state.currentIndex < state.queue.length - 1) {
    state.currentIndex++;
    state.isFlipped = false;
    render();
  } else {
    state.done = true;
    render();
  }
}

function prevCard() {
  if (state.currentIndex > 0) {
    state.currentIndex--;
    state.isFlipped = false;
    render();
  }
}

function jumpTo(id) {
  const idx = state.queue.findIndex(c => c.id === id);
  if (idx >= 0) {
    state.currentIndex = idx;
    state.isFlipped = false;
    state.done = false;
    render();
  }
}

function restartAll() {
  state.mode = 'all';
  document.querySelectorAll('.mode-btn').forEach((b,i) => b.classList.toggle('active', i===0));
  buildQueue();
  render();
}

function restartIncorrect() {
  state.mode = 'incorrect';
  document.querySelectorAll('.mode-btn').forEach((b,i) => b.classList.toggle('active', i===1));
  buildQueue();
  render();
}

function updateStats() {
  document.getElementById('statTotal').textContent = `${CARDS.length} cards`;
  document.getElementById('statCorrect').textContent = `${state.correct.size} correct`;
  document.getElementById('statIncorrect').textContent = `${state.incorrect.size} incorrect`;
  const remaining = state.queue.length - state.currentIndex - 1;
  document.getElementById('statRemaining').textContent = `${Math.max(0,remaining)} remaining`;
}

function render() {
  updateStats();
  const main = document.getElementById('mainContent');

  if (state.done) {
    const inc = state.incorrect.size;
    main.innerHTML = `
      <div class="completion">
        <div class="completion-icon">🌿</div>
        <div class="completion-title">Session Complete</div>
        <div class="completion-sub">
          ${state.queue.length} cards reviewed<br>
          ${state.correct.size} correct · ${state.incorrect.size} to review
        </div>
        <div class="completion-btns">
          <button class="btn btn-restart" onclick="restartAll()">Start Over</button>
          ${inc > 0 ? `<button class="btn btn-review-only" onclick="restartIncorrect()">Review ${inc} Missed</button>` : ''}
        </div>
      </div>`;
    return;
  }

  const card = state.queue[state.currentIndex];
  const progress = ((state.currentIndex) / state.queue.length * 100).toFixed(1);

  const frontText = state.direction === 'en-jp' ? card.en : card.jp;
  const backText  = state.direction === 'en-jp' ? card.jp : card.en;
  const frontLang = state.direction === 'en-jp' ? 'English' : '日本語';
  const backLang  = state.direction === 'en-jp' ? '日本語' : 'English';

  const isCorrect = state.correct.has(card.id);
  const isIncorrect = state.incorrect.has(card.id);
  const statusDot = isCorrect ? '🟢' : isIncorrect ? '🔴' : '';

  main.innerHTML = `
    <div class="progress-wrap">
      <div class="progress-bar"><div class="progress-fill" style="width:${progress}%"></div></div>
      <div class="progress-text">${state.currentIndex + 1} / ${state.queue.length}</div>
    </div>

    <div class="card-scene">
      <div class="card ${state.isFlipped ? 'flipped' : ''}" onclick="flipCard()" id="theCard">
        <div class="card-face card-front">
          <div class="cat-badge">${card.cat} ${statusDot}</div>
          <div class="card-lang">${frontLang}</div>
          <div class="card-text">${frontText}</div>
          <div class="card-hint"><span class="hint-icon">↕</span> tap to flip</div>
        </div>
        <div class="card-face card-back">
          <div class="cat-badge">${card.cat}</div>
          <div class="card-lang">${backLang}</div>
          <div class="card-text">${backText}</div>
          <div class="card-hint"><span class="hint-icon">↕</span> tap to flip back</div>
        </div>
      </div>
    </div>

    <div class="actions">
      <div class="nav-btns">
        <button class="nav-btn" onclick="prevCard()" ${state.currentIndex===0?'disabled':''}>←</button>
      </div>
      <button class="btn btn-incorrect" onclick="markIncorrect()" ${!state.isFlipped?'disabled':''}>✗ Missed</button>
      <button class="btn btn-correct" onclick="markCorrect()" ${!state.isFlipped?'disabled':''}>✓ Got it</button>
      <div class="nav-btns">
        <button class="nav-btn" onclick="nextCard()">→</button>
      </div>
    </div>

    <div class="review-panel">
      <div class="review-title">Completed in this session</div>
      <div class="review-chips">
        ${[...state.correct].slice(-8).map(id => {
          const c = CARDS.find(x=>x.id===id);
          return c ? `<button class="review-chip chip-correct" onclick="jumpTo(${c.id})" title="${c.en}">#${c.id}</button>` : '';
        }).join('')}
        ${[...state.incorrect].slice(-8).map(id => {
          const c = CARDS.find(x=>x.id===id);
          return c ? `<button class="review-chip chip-incorrect" onclick="jumpTo(${c.id})" title="${c.en}">#${c.id}</button>` : '';
        }).join('')}
        ${state.correct.size + state.incorrect.size === 0 ? '<span style="font-size:12px;color:var(--mist)">Cards you mark will appear here</span>' : ''}
      </div>
    </div>`;
}

// Init
loadStorage();
buildQueue();
render();
</script>
