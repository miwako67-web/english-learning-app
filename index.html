<style>
*{box-sizing:border-box;margin:0;padding:0;}
:root{
  --bg:#0f0e0c;--bg2:#171613;--bg3:#201e1a;
  --gold:#c8a96e;--gold2:#e8c88e;
  --text:#e8e4dc;--text2:#b0a898;--text3:#706860;
  --border:#2a2620;
  --green:#3a5a3a;--green2:#1a2e1a;
  --blue:#3a4a6a;--blue2:#1a2030;
  --purple:#5a3a6a;--purple2:#2a1a30;
  --red:#6a3a3a;--red2:#301a1a;
}
html,body{background:var(--bg);min-height:100%;color:var(--text);}
body{font-family:'Noto Sans JP',sans-serif;}

.app{max-width:800px;margin:0 auto;padding:0 0 40px;}

/* Header */
.header{padding:32px 24px 24px;border-bottom:0.5px solid var(--border);}
.header h1{font-family:'Cormorant Garamond',serif;font-size:26px;font-weight:600;color:var(--text);}
.header p{font-size:11px;color:var(--text3);margin-top:4px;letter-spacing:1px;}
.stats{display:flex;gap:16px;margin-top:16px;}
.stat{font-size:11px;color:var(--text3);}
.stat span{color:var(--gold);font-size:13px;font-weight:500;}

/* Filter tabs */
.filters{display:flex;gap:8px;padding:16px 24px;flex-wrap:wrap;border-bottom:0.5px solid var(--border);}
.filter-btn{padding:6px 14px;border-radius:20px;border:0.5px solid var(--border);background:none;color:var(--text3);font-size:11px;cursor:pointer;font-family:'Noto Sans JP',sans-serif;transition:all 0.2s;white-space:nowrap;}
.filter-btn:hover{border-color:var(--gold);color:var(--gold);}
.filter-btn.active{background:var(--gold);border-color:var(--gold);color:#1a1000;font-weight:500;}

/* Section */
.section{padding:20px 24px 0;}
.section-title{font-size:10px;color:var(--text3);letter-spacing:1.5px;text-transform:uppercase;margin-bottom:12px;display:flex;align-items:center;gap:8px;}
.section-title::after{content:'';flex:1;height:0.5px;background:var(--border);}

/* Grid */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:10px;margin-bottom:8px;}

/* App card */
.card{background:var(--bg2);border:0.5px solid var(--border);border-radius:10px;padding:16px;text-decoration:none;color:inherit;transition:all 0.2s;display:block;}
.card:hover{border-color:var(--gold);transform:translateY(-1px);}
.card-top{display:flex;align-items:flex-start;justify-content:space-between;margin-bottom:10px;}
.card-icon{font-size:22px;}
.card-badges{display:flex;gap:4px;flex-wrap:wrap;justify-content:flex-end;}
.badge{font-size:9px;padding:2px 6px;border-radius:8px;border:0.5px solid;}
.badge-mac{background:#1a2030;border-color:#3a4a6a;color:#8a9aba;}
.badge-ios{background:#1a2a1a;border-color:#3a5a3a;color:#8aba8a;}
.badge-new{background:#2a1800;border-color:#c8a96e;color:#c8a96e;}
.badge-life{background:#2a1a30;border-color:#5a3a6a;color:#aa8aba;}
.card-name{font-size:13px;font-weight:500;color:var(--text);margin-bottom:4px;line-height:1.4;}
.card-desc{font-size:11px;color:var(--text3);line-height:1.6;}
.card-date{font-size:10px;color:var(--text3);margin-top:8px;opacity:0.6;}

/* No results */
.no-results{text-align:center;padding:40px;color:var(--text3);font-size:13px;}
</style>

var currentFilter = 'all';

function filterApps(cat) {
  currentFilter = cat;
  document.querySelectorAll('.filter-btn').forEach(function(b) { b.classList.remove('active'); });
  event.target.classList.add('active');
  renderApps();
}

function renderApps() {
  var list = document.getElementById('appList');
  list.innerHTML = '';

  var filtered = APPS.filter(function(a) {
    if (currentFilter === 'all') return true;
    if (currentFilter === 'new') return a.category.includes('new');
    if (currentFilter === 'life') return a.category.includes('life');
    if (currentFilter === 'english') return a.category.includes('english');
    if (currentFilter === 'mac') return a.platform === 'mac' || a.platform === 'both';
    if (currentFilter === 'ios') return a.platform === 'ios' || a.platform === 'both';
    return true;
  });

  document.getElementById('totalCount').textContent = APPS.length;

  if (filtered.length === 0) {
    list.innerHTML = '<div class="no-results">該当するアプリがありません</div>';
    return;
  }

  // Group
  var groups = {};
  filtered.forEach(function(a) {
    var grp = '';
    if (a.category.includes('life')) grp = '🌱 ライフスタイル';
    else if (a.platform === 'both') grp = '🆕 新着';
    else if (a.platform === 'mac') grp = '🖥 Mac版 英語練習';
    else if (a.platform === 'ios') grp = '📱 iOS版 英語練習';
    if (!groups[grp]) groups[grp] = [];
    groups[grp].push(a);
  });

  // Sort group order
  var order = ['🌱 ライフスタイル','🆕 新着','🖥 Mac版 英語練習','📱 iOS版 英語練習'];
  order.forEach(function(grp) {
    if (!groups[grp] || groups[grp].length === 0) return;
    var sec = document.createElement('div');
    sec.className = 'section';
    var title = document.createElement('div');
    title.className = 'section-title';
    title.textContent = grp;
    sec.appendChild(title);
    var grid = document.createElement('div');
    grid.className = 'grid';
    groups[grp].forEach(function(a) {
      var card = document.createElement('a');
      card.className = 'card';
      card.href = a.url;
      card.target = '_blank';
      var badges = '';
      if (a.category.includes('new')) badges += '<span class="badge badge-new">NEW</span>';
      if (a.category.includes('life')) badges += '<span class="badge badge-life">ライフ</span>';
      if (a.platform === 'mac') badges += '<span class="badge badge-mac">Mac</span>';
      if (a.platform === 'ios') badges += '<span class="badge badge-ios">iOS</span>';
      if (a.platform === 'both') badges += '<span class="badge badge-mac">Mac</span><span class="badge badge-ios">iOS</span>';
      card.innerHTML =
        '<div class="card-top"><div class="card-icon">' + a.icon + '</div><div class="card-badges">' + badges + '</div></div>'
        + '<div class="card-name">' + a.name + '</div>'
        + '<div class="card-desc">' + a.desc + '</div>'
        + '<div class="card-date">' + a.date + '</div>';
      grid.appendChild(card);
    });
    sec.appendChild(grid);
    list.appendChild(sec);
  });
}
