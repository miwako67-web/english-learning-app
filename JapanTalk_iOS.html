<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🗾 Japan Talk — 日本紹介 チャンク反射</title>
<link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@400;600;700&family=DM+Sans:ital,wght@0,300;0,400;0,500;1,300;1,400&display=swap" rel="stylesheet">
<style>
:root{
--ink:#1a1410;--paper:#f5f0e8;--gold:#c8962a;--moss:#4a7c59;
--indigo:#3d5a8a;--crimson:#a03030;--panel:#fffdf8;--border:rgba(26,20,16,0.12);
}
*{margin:0;padding:0;box-sizing:border-box;}
body{font-family:'DM Sans',sans-serif;background:var(--paper);color:var(--ink);min-height:100vh;}

/* HEADER */
header{background:var(--ink);padding:16px 20px 0;position:sticky;top:0;z-index:100;}
.h-top{display:flex;align-items:center;gap:10px;padding-bottom:14px;}
.h-titles{flex:1;}
.h-titles h1{font-family:'Shippori Mincho',serif;color:var(--gold);font-size:16px;font-weight:700;}
.h-titles p{color:rgba(245,240,232,0.42);font-size:10px;margin-top:1px;}
.h-right{display:flex;align-items:center;gap:8px;}
.h-score .num{font-size:20px;font-weight:500;color:var(--gold);}
.h-score .lbl{font-family:'Shippori Mincho',serif;font-size:9px;color:rgba(245,240,232,0.4);}
.h-key-btn{padding:5px 10px;border-radius:7px;border:1px solid rgba(200,150,42,0.4);background:transparent;color:rgba(200,150,42,0.7);font-size:10px;cursor:pointer;}
.h-key-btn:hover{border-color:var(--gold);color:var(--gold);}
.h-auto-btn{padding:5px 10px;border-radius:7px;border:1px solid rgba(200,150,42,0.4);background:transparent;color:rgba(200,150,42,0.7);font-size:10px;cursor:pointer;transition:all .25s;white-space:nowrap;}
.h-auto-btn:hover{border-color:var(--gold);color:var(--gold);}
.h-auto-btn.on{background:rgba(200,150,42,0.2);border-color:var(--gold);color:var(--gold);}
nav{display:flex;}
.tab{flex:1;padding:8px 4px;background:none;border:none;border-bottom:2px solid transparent;color:rgba(245,240,232,0.38);font-family:'DM Sans',sans-serif;font-size:10px;cursor:pointer;transition:all .2s;display:flex;flex-direction:column;align-items:center;gap:2px;}
.tab span:first-child{font-size:13px;}
.tab.active{color:var(--gold);border-bottom-color:var(--gold);}

main{padding:14px;max-width:600px;margin:0 auto;}
.page{display:none;}.page.active{display:block;}
.sec{font-family:'Shippori Mincho',serif;font-size:10px;font-weight:600;color:rgba(26,20,16,0.35);letter-spacing:.12em;text-transform:uppercase;margin:16px 0 10px;}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:16px;}
.chip{padding:5px 12px;border-radius:20px;border:1.5px solid var(--border);background:var(--panel);font-size:11px;cursor:pointer;transition:all .2s;color:var(--ink);}
.chip.active{background:var(--ink);color:var(--paper);border-color:var(--ink);}
.mode-cards{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:20px;}
.mode-card{background:var(--panel);border:1.5px solid var(--border);border-radius:14px;padding:14px 12px;cursor:pointer;transition:all .2s;text-align:center;}
.mode-card:hover{border-color:var(--gold);}
.mode-card.selected{border-color:var(--gold);background:rgba(200,150,42,0.07);}
.mode-emoji{font-size:24px;margin-bottom:6px;}
.mode-name{font-size:13px;font-weight:500;margin-bottom:3px;}
.mode-desc{font-family:'Shippori Mincho',serif;font-size:10px;color:rgba(26,20,16,0.45);line-height:1.5;}
.start-btn{width:100%;padding:14px;border-radius:12px;border:none;background:var(--ink);color:var(--gold);font-family:'DM Sans',sans-serif;font-size:15px;font-weight:500;cursor:pointer;}
.start-btn:hover{opacity:.88;}

/* TRAINING */
.train-hd{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px;}
.train-prog-wrap{flex:1;height:5px;background:var(--border);border-radius:3px;margin:0 12px;overflow:hidden;}
.train-prog-fill{height:100%;background:var(--gold);border-radius:3px;transition:width .4s;}
.train-ctr{font-size:11px;color:rgba(26,20,16,0.4);}
.quit-btn{font-size:11px;color:rgba(26,20,16,0.35);background:none;border:none;cursor:pointer;text-decoration:underline;}
.timer-wrap{display:flex;justify-content:center;margin-bottom:14px;}
.timer-ring{position:relative;width:64px;height:64px;}
.timer-ring svg{transform:rotate(-90deg);}
.timer-ring circle{fill:none;stroke-width:5;}
.timer-bg{stroke:var(--border);}
.timer-fg{stroke:var(--gold);stroke-linecap:round;transition:stroke-dashoffset .1s linear,stroke .3s;}
.timer-num{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:18px;font-weight:500;color:var(--ink);}
.loop-banner{background:rgba(200,150,42,0.1);border:1px solid rgba(200,150,42,0.3);border-radius:10px;padding:8px 12px;margin-bottom:12px;font-family:'Shippori Mincho',serif;font-size:12px;color:var(--gold);text-align:center;}

/* AUTO-PLAY BAR */
.autoplay-bar{display:none;align-items:center;justify-content:space-between;background:rgba(200,150,42,0.1);border:1px solid rgba(200,150,42,0.28);border-radius:10px;padding:8px 14px;margin-bottom:12px;}
.autoplay-bar.visible{display:flex;}
.ap-left{display:flex;align-items:center;gap:8px;}
.ap-dot{width:8px;height:8px;border-radius:50%;background:var(--gold);}
.ap-dot.jp{background:#4a7c59;}
.ap-dot.en{background:#3d5a8a;}
.ap-dot.wait{background:#c86a2a;animation:blink 0.8s ease-in-out infinite;}
.ap-dot.idle{background:rgba(200,150,42,0.3);}
@keyframes blink{0%,100%{opacity:1;}50%{opacity:0.2;}}
.ap-label{font-family:'Shippori Mincho',serif;font-size:11px;color:var(--gold);}
.ap-skip-btn{font-size:10px;padding:3px 10px;border-radius:20px;border:1px solid rgba(200,150,42,0.4);background:transparent;color:var(--gold);cursor:pointer;}
.ap-skip-btn:hover{background:rgba(200,150,42,0.15);}

/* FLASH CARD */
.flash-card{background:var(--panel);border:1.5px solid var(--border);border-radius:18px;padding:28px 22px;text-align:center;margin-bottom:14px;box-shadow:0 4px 24px rgba(26,20,16,0.08);min-height:200px;display:flex;flex-direction:column;align-items:center;justify-content:center;cursor:pointer;transition:border-color .2s;}
.flash-card.revealed{border-color:var(--moss);}
.flash-card.jp-speaking{border-color:#4a7c59;box-shadow:0 0 0 3px rgba(74,124,89,0.15);}
.flash-card.en-speaking{border-color:#3d5a8a;box-shadow:0 0 0 3px rgba(61,90,138,0.15);}
.card-cat{font-size:10px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:rgba(26,20,16,0.3);margin-bottom:10px;}
.card-jp{font-family:'Shippori Mincho',serif;font-size:21px;font-weight:700;line-height:1.55;margin-bottom:6px;}
.card-sub{font-family:'Shippori Mincho',serif;font-size:12px;color:rgba(26,20,16,0.4);margin-bottom:12px;font-style:italic;}
.card-hint{font-size:11px;color:rgba(26,20,16,0.3);font-style:italic;}
.card-en{font-size:18px;font-weight:500;line-height:1.5;margin-bottom:8px;display:none;}
.card-alt{font-size:12px;color:rgba(26,20,16,0.5);display:none;font-style:italic;margin-bottom:10px;}
.card-tip{font-family:'Shippori Mincho',serif;font-size:11px;color:var(--indigo);background:rgba(61,90,138,0.08);border-radius:7px;padding:8px 12px;display:none;line-height:1.65;text-align:left;width:100%;}
.card-chunks{display:none;width:100%;margin-top:10px;border-top:1px solid var(--border);padding-top:10px;}
.cc-row{display:flex;align-items:center;gap:8px;padding:4px 0;}
.cc-num{font-size:10px;font-weight:600;color:rgba(26,20,16,0.3);width:16px;flex-shrink:0;}
.cc-en{font-size:12px;color:rgba(26,20,16,0.55);}
.flash-card.revealed .card-en,.flash-card.revealed .card-alt,.flash-card.revealed .card-tip,.flash-card.revealed .card-chunks{display:block;}
.flash-card.revealed .card-hint{display:none;}

/* VOICE */
.voice-btn-wrap{display:flex;justify-content:center;margin-bottom:10px;}
.voice-btn{display:flex;align-items:center;gap:8px;padding:10px 20px;border-radius:30px;border:1.5px solid var(--gold);background:rgba(200,150,42,0.08);color:var(--gold);font-family:'DM Sans',sans-serif;font-size:13px;font-weight:500;cursor:pointer;transition:all .2s;}
.voice-btn:hover{background:rgba(200,150,42,0.18);}
.voice-btn.playing{background:rgba(200,150,42,0.25);}
.voice-icon{font-size:16px;}
.voice-btn.playing .voice-icon{animation:pulse 0.6s ease-in-out infinite alternate;}
@keyframes pulse{from{transform:scale(1);}to{transform:scale(1.2);}}
.voice-status{font-size:10px;color:rgba(26,20,16,0.4);text-align:center;margin-bottom:8px;min-height:14px;}

/* ACTIONS */
.action-row{display:flex;gap:8px;margin-bottom:10px;}
.act-btn{flex:1;padding:13px;border-radius:12px;border:none;font-family:'DM Sans',sans-serif;font-size:13px;font-weight:500;cursor:pointer;transition:opacity .15s;}
.act-btn:hover{opacity:.85;}
.act-reveal{background:var(--indigo);color:#fff;flex:2;}
.act-ok{background:var(--moss);color:#fff;}
.act-ng{background:rgba(160,48,48,0.1);color:var(--crimson);}
.act-skip{width:100%;padding:9px;border-radius:9px;border:1.5px solid var(--border);background:var(--panel);font-family:'DM Sans',sans-serif;font-size:11px;cursor:pointer;color:rgba(26,20,16,0.45);}

/* RESULT */
.result-wrap{text-align:center;padding:24px 0;}
.res-emoji{font-size:52px;margin-bottom:12px;}
.res-title{font-family:'Shippori Mincho',serif;font-size:20px;font-weight:700;margin-bottom:6px;}
.res-sub{font-size:13px;color:rgba(26,20,16,0.5);margin-bottom:22px;font-family:'Shippori Mincho',serif;}
.res-stats{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-bottom:22px;}
.rs{background:var(--panel);border:1px solid var(--border);border-radius:12px;padding:12px 8px;text-align:center;}
.rs-n{font-size:24px;font-weight:500;line-height:1;margin-bottom:3px;}
.rs-n.g{color:var(--moss);}.rs-n.r{color:var(--crimson);}.rs-n.b{color:var(--indigo);}
.rs-l{font-family:'Shippori Mincho',serif;font-size:9px;color:rgba(26,20,16,0.4);}
.result-btns{display:flex;flex-direction:column;gap:8px;}
.res-btn{padding:13px;border-radius:12px;border:none;font-family:'DM Sans',sans-serif;font-size:13px;font-weight:500;cursor:pointer;}
.res-btn.p{background:var(--crimson);color:#fff;}
.res-btn.s{background:var(--ink);color:var(--paper);}
.res-btn.t{background:var(--panel);color:var(--ink);border:1.5px solid var(--border);}

/* LIST */
.list-item{background:var(--panel);border:1px solid var(--border);border-radius:11px;padding:13px 14px;margin-bottom:8px;}
.li-cat{font-size:9px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:rgba(26,20,16,0.3);margin-bottom:3px;display:flex;justify-content:space-between;align-items:center;}
.li-jp{font-family:'Shippori Mincho',serif;font-size:14px;font-weight:600;margin-bottom:8px;}
.li-chunks{margin-bottom:6px;}
.li-chunk-row{display:flex;align-items:center;gap:8px;padding:3px 0;}
.li-cn{font-size:10px;font-weight:600;color:rgba(26,20,16,0.3);width:16px;flex-shrink:0;}
.li-ce{font-size:12px;color:rgba(26,20,16,0.55);}
.li-full{font-size:13px;font-weight:500;color:var(--ink);border-top:1px solid var(--border);padding-top:7px;margin-top:4px;}
.li-right{display:flex;align-items:center;gap:6px;}
.li-done{font-size:9px;background:var(--moss);color:#fff;padding:2px 7px;border-radius:20px;display:none;}
.li-done.show{display:inline;}
.li-voice-btn{padding:4px 10px;border-radius:20px;border:1px solid var(--gold);background:transparent;color:var(--gold);font-size:10px;cursor:pointer;}

/* STATS */
.overall{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-bottom:14px;}
.os{background:var(--panel);border:1px solid var(--border);border-radius:12px;padding:13px 8px;text-align:center;}
.osn{font-size:22px;font-weight:500;line-height:1;margin-bottom:3px;}
.osn.g{color:var(--moss);}.osn.gold{color:var(--gold);}
.osl{font-family:'Shippori Mincho',serif;font-size:9px;color:rgba(26,20,16,0.4);}
.cat-stat{background:var(--panel);border:1px solid var(--border);border-radius:11px;padding:12px 14px;margin-bottom:8px;}
.cst{display:flex;align-items:center;justify-content:space-between;margin-bottom:6px;}
.csn{font-size:13px;font-weight:500;}
.csp{font-size:12px;color:var(--moss);font-weight:500;}
.csb{height:4px;background:var(--border);border-radius:2px;overflow:hidden;}
.csf{height:100%;background:var(--moss);border-radius:2px;transition:width .5s;}
.reset-btn{width:100%;padding:10px;border-radius:9px;border:1.5px solid var(--border);background:var(--panel);font-family:'DM Sans',sans-serif;font-size:11px;color:rgba(26,20,16,0.4);cursor:pointer;margin-top:12px;}
.reset-btn:hover{border-color:var(--crimson);color:var(--crimson);}

/* TOAST */
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:var(--ink);color:var(--paper);padding:10px 20px;border-radius:30px;font-size:12px;z-index:1000;opacity:0;transition:opacity .3s;pointer-events:none;}
.toast.show{opacity:1;}
</style>
</head>
<body>

<div class="toast" id="toast"></div>

<header>
<div class="h-top">
<span style="font-size:22px">🗾</span>
<div class="h-titles">
<h1>Japan Talk</h1>
<p>日本紹介 チャンク反射トレーニング — 100フレーズ</p>
</div>
<div class="h-right">
  <button class="h-auto-btn" id="auto-play-btn" onclick="toggleAutoPlay()">▶ 自動OFF</button>
  <div class="h-score">
    <div class="num" id="h-mastered">0</div>
    <div class="lbl">習得済み</div>
  </div>
</div>
</div>
<nav>
<button class="tab active" onclick="switchTab('train',this)"><span>⚡</span><span>トレーニング</span></button>
<button class="tab" onclick="switchTab('list',this)"><span>📋</span><span>一覧</span></button>
<button class="tab" onclick="switchTab('stats',this)"><span>📊</span><span>記録</span></button>
</nav>
</header>

<main>
<div id="page-train" class="page active">
<div id="train-setup">
<div class="sec" style="margin-top:14px">カテゴリを選ぶ</div>
<div class="chips" id="cat-chips"></div>
<div class="sec">モードを選ぶ</div>
<div class="mode-cards">
<div class="mode-card selected" id="mode-normal" onclick="selectMode('normal')">
<div class="mode-emoji">🃏</div><div class="mode-name">通常モード</div>
<div class="mode-desc">自分のペースで1枚ずつ。</div>
</div>
<div class="mode-card" id="mode-timer" onclick="selectMode('timer')">
<div class="mode-emoji">⏱️</div><div class="mode-name">タイマーモード</div>
<div class="mode-desc">3秒以内に口から出す。</div>
</div>
<div class="mode-card" id="mode-loop" onclick="selectMode('loop')">
<div class="mode-emoji">🔁</div><div class="mode-name">ループモード</div>
<div class="mode-desc">5回連続正解で身体化。</div>
</div>
<div class="mode-card" id="mode-review" onclick="selectMode('review')">
<div class="mode-emoji">🔄</div><div class="mode-name">復習モード</div>
<div class="mode-desc">未習得・間違えたものだけ。</div>
</div>
</div>
<button class="start-btn" onclick="startTraining()">トレーニング開始 →</button>
</div>

<div id="train-area" style="display:none">
<div class="train-hd">
<span class="train-ctr" id="train-ctr">1 / 10</span>
<div class="train-prog-wrap"><div class="train-prog-fill" id="train-prog" style="width:0%"></div></div>
<button class="quit-btn" onclick="quitTraining()">終了</button>
</div>
<div id="timer-wrap" class="timer-wrap" style="display:none">
<div class="timer-ring">
<svg width="64" height="64" viewBox="0 0 64 64">
<circle class="timer-bg" cx="32" cy="32" r="27"/>
<circle class="timer-fg" id="timer-circle" cx="32" cy="32" r="27" stroke-dasharray="169.6" stroke-dashoffset="0"/>
</svg>
<div class="timer-num" id="timer-num">3</div>
</div>
</div>
<div id="loop-banner" class="loop-banner" style="display:none">
🔁 ループモード — あと<span id="loop-remain"></span>回連続正解で習得！
</div>

<div class="autoplay-bar" id="autoplay-bar">
  <div class="ap-left">
    <div class="ap-dot idle" id="ap-dot"></div>
    <span class="ap-label" id="ap-label">自動再生モード</span>
  </div>
  <button class="ap-skip-btn" onclick="autoSkipNow()">今すぐ次へ →</button>
</div>

<div class="flash-card" id="flash-card" onclick="onCardTap()">
<div class="card-cat"  id="card-cat"></div>
<div class="card-jp"   id="card-jp"></div>
<div class="card-sub"  id="card-sub"></div>
<div class="card-hint" id="card-hint">タップして英語を確認</div>
<div class="card-en"   id="card-en"></div>
<div class="card-alt"  id="card-alt"></div>
<div class="card-tip"  id="card-tip"></div>
<div class="card-chunks" id="card-chunks"></div>
</div>

<div class="voice-btn-wrap" id="voice-btn-wrap" style="display:none">
<button class="voice-btn" id="voice-play-btn" onclick="playEnglishManual()">
<span class="voice-icon">🔊</span>
<span id="voice-btn-label">英語を聴く</span>
</button>
</div>
<div class="voice-status" id="voice-status"></div>
<div class="action-row">
<button class="act-btn act-reveal" id="btn-reveal" onclick="revealCard()">英語を見る</button>
<button class="act-btn act-ok" id="btn-ok" onclick="markOk()" style="display:none">✓ 言えた！</button>
<button class="act-btn act-ng" id="btn-ng" onclick="markNg()" style="display:none">✕ 言えなかった</button>
</div>
<button class="act-skip" onclick="skipCard()">スキップ →</button>
</div>

<div id="train-result" style="display:none">
<div class="result-wrap">
<div class="res-emoji" id="res-emoji">🎉</div>
<div class="res-title" id="res-title">完了！</div>
<div class="res-sub"   id="res-sub"></div>
<div class="res-stats">
<div class="rs"><div class="rs-n g" id="res-ok">0</div><div class="rs-l">言えた！</div></div>
<div class="rs"><div class="rs-n r" id="res-ng">0</div><div class="rs-l">言えなかった</div></div>
<div class="rs"><div class="rs-n b" id="res-total">0</div><div class="rs-l">総問数</div></div>
</div>
<div class="result-btns">
<button class="res-btn p" id="res-loop-btn" style="display:none" onclick="startLoopFromResult()">🔁 言えなかった分をループ練習</button>
<button class="res-btn s" onclick="backToSetup()">もう一度設定から</button>
<button class="res-btn t" onclick="switchTab('stats',document.querySelectorAll('.tab')[2])">記録を見る</button>
</div>
</div>
</div>
</div>

<div id="page-list" class="page">
<div class="sec" style="margin-top:14px">カテゴリで絞り込む</div>
<div class="chips" id="list-chips"></div>
<div id="list-items"></div>
</div>

<div id="page-stats" class="page">
<div class="sec" style="margin-top:14px">全体の進捗</div>
<div class="overall">
<div class="os"><div class="osn gold" id="st-total">100</div><div class="osl">総フレーズ</div></div>
<div class="os"><div class="osn g" id="st-master">0</div><div class="osl">習得済み</div></div>
<div class="os"><div class="osn" id="st-learn">100</div><div class="osl">学習中</div></div>
</div>
<div class="sec">カテゴリ別</div>
<div id="cat-stats"></div>
<button class="reset-btn" onclick="resetAll()">↺ 全データをリセット</button>
</div>
</main>

<script>
const PHRASES=[
{id:1,cat:'観光地・名所',jp:'京都は古い都です',sub:'',en:"It's the old capital of Japan.",alt:"Kyoto was Japan's capital for over 1,000 years.",tip:'old capital（古い都）。シンプルな一言で伝わる。',chunks:['the old capital','the old capital of Japan',"It's the old capital of Japan."]},

// Web Speech API speak (for iOS)
function speakWebSpeech(text, lang) {
  return new Promise((resolve) => {
    if (!window.speechSynthesis) { resolve(false); return; }
    const myToken = currentFlowToken;

    // Small delay to let any previous cancel settle
    setTimeout(() => {
      if (myToken !== currentFlowToken) { resolve(false); return; }

      const utter = new SpeechSynthesisUtterance(text);
      utter.lang = lang === 'ja' ? 'ja-JP' : 'en-AU';
      utter.rate = 0.9;
      utter.volume = 1.0;

      const voices = window.speechSynthesis.getVoices();
      const match = voices.find(v => v.lang.startsWith(lang === 'ja' ? 'ja' : 'en'));
      if (match) utter.voice = match;

      let done = false;
      const finish = (val) => {
        if (done) return;
        done = true;
        resolve(myToken === currentFlowToken ? val : false);
      };

      utter.onend = () => finish(true);
      utter.onerror = (e) => finish(false);

      window.speechSynthesis.speak(utter);
    }, 150);
  });
}
function base64ToBlob(b64, mime) {
  const bytes = atob(b64);
  const arr = new Uint8Array(bytes.length);
  for (let i = 0; i < bytes.length; i++) arr[i] = bytes.charCodeAt(i);
  return new Blob([arr], { type: mime });
}

// Google TTS speak (for Mac/desktop)
async function speakGoogleTTS(text, lang) {
  const myToken = currentFlowToken;
  const voiceConfig = lang === 'ja'
    ? { languageCode: 'ja-JP', name: 'ja-JP-Neural2-B' }
    : { languageCode: 'en-AU', name: 'en-AU-Neural2-A' };

  try {
    const res = await fetch(
      `https://texttospeech.googleapis.com/v1/text:synthesize?key=${gApiKey}`,
      {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          input: { text },
          voice: voiceConfig,
          audioConfig: { audioEncoding: 'MP3', speakingRate: 0.95 }
        })
      }
    );
    if (myToken !== currentFlowToken) return false;
    if (!res.ok) {
      const err = await res.json().catch(() => ({}));
      throw new Error(err.error?.message || `エラー ${res.status}`);
    }
    const data = await res.json();
    if (myToken !== currentFlowToken) return false;

    const blob = base64ToBlob(data.audioContent, 'audio/mp3');
    const blobUrl = URL.createObjectURL(blob);
    const audio = new Audio(blobUrl);
    audio._blobUrl = blobUrl;
    currentAudio = audio;
    isPlaying = true;

    try { await audio.play(); } catch(e) {
      URL.revokeObjectURL(blobUrl);
      if (currentAudio === audio) { currentAudio = null; isPlaying = false; }
      return false;
    }

    if (myToken !== currentFlowToken) {
      audio.pause();
      URL.revokeObjectURL(blobUrl);
      if (currentAudio === audio) { currentAudio = null; isPlaying = false; }
      return false;
    }

    return new Promise((resolve) => {
      let resolved = false;
      let fallbackTimer = null;

      const done = (val) => {
        if (resolved) return;
        resolved = true;
        if (fallbackTimer) clearTimeout(fallbackTimer);
        URL.revokeObjectURL(blobUrl);
        if (currentAudio === audio) { currentAudio = null; isPlaying = false; }
        resolve(val);
      };

      audio.onended = () => done(true);
      audio.onerror = () => done(false);

      const setFallback = () => {
        const dur = isFinite(audio.duration) && audio.duration > 0 ? audio.duration : 10;
        const remaining = Math.max(0, (dur - (audio.currentTime || 0))) * 1000;
        fallbackTimer = setTimeout(() => done(true), remaining + 2000);
      };

      if (isFinite(audio.duration) && audio.duration > 0) {
        setFallback();
      } else {
        audio.addEventListener('loadedmetadata', setFallback, { once: true });
        setTimeout(() => { if (!resolved && !fallbackTimer) setFallback(); }, 2000);
      }

      const poll = setInterval(() => {
        if (myToken !== currentFlowToken) {
          clearInterval(poll);
          audio.pause();
          done(false);
        } else if (resolved) {
          clearInterval(poll);
        }
      }, 200);
    });
  } catch(e) {
    if (myToken !== currentFlowToken) return false;
    showToast('⚠️ ' + e.message);
    return false;
  }
}

// Main speak function: iOS uses Web Speech, others use Google TTS
async function speakGoogle(text, lang) {
  if (isIOS) {
    return speakWebSpeech(text, lang);
  } else {
    if (!gApiKey) {
      showToast('🔑 右上の「音声設定」からAPIキーを設定してください');
      return false;
    }
    return speakGoogleTTS(text, lang);
  }
}

let currentAudio = null;
let isPlaying = false;
let currentFlowToken = 0; // incremented each time a new flow starts

function stopAudio() {
  currentFlowToken++; // invalidate any pending promises
  if (currentAudio) {
    currentAudio.pause();
    currentAudio = null;
  }
  isPlaying = false;
  setVoiceBtnState(false);
  setVoiceStatus('');
}

async function speakGoogle(text, lang) {
  if (!gApiKey) {
    showToast('🔑 右上の「音声設定」からAPIキーを設定してください');
    return false;
  }
  const myToken = currentFlowToken;
  const voiceConfig = lang === 'ja'
    ? { languageCode: 'ja-JP', name: 'ja-JP-Neural2-B' }
    : { languageCode: 'en-AU', name: 'en-AU-Neural2-A' };

  try {
    const res = await fetch(
      `https://texttospeech.googleapis.com/v1/text:synthesize?key=${gApiKey}`,
      {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          input: { text },
          voice: voiceConfig,
          audioConfig: { audioEncoding: 'MP3', speakingRate: 0.95 }
        })
      }
    );
    // Check if still valid after async fetch
    if (myToken !== currentFlowToken) return false;
    if (!res.ok) {
      const err = await res.json().catch(() => ({}));
      throw new Error(err.error?.message || `エラー ${res.status}`);
    }
    const data = await res.json();
    if (myToken !== currentFlowToken) return false;

    const audio = new Audio('data:audio/mp3;base64,' + data.audioContent);
    currentAudio = audio;
    isPlaying = true;

    return new Promise((resolve) => {
      const cleanup = (val) => {
        if (currentAudio === audio) { currentAudio = null; isPlaying = false; }
        resolve(val);
      };
      audio.onended = () => cleanup(true);
      audio.onerror = () => cleanup(false);
      audio.play().catch(() => cleanup(false));

      // Poll for token invalidation (stopAudio called externally)
      const poll = setInterval(() => {
        if (myToken !== currentFlowToken) {
          clearInterval(poll);
          audio.pause();
          resolve(false);
        }
        if (!isPlaying && currentAudio !== audio) {
          clearInterval(poll);
        }
      }, 100);
    });
  } catch(e) {
    if (myToken !== currentFlowToken) return false;
    showToast('⚠️ ' + e.message);
    return false;
  }
}

// ===================== AUTO-PLAY STATE =====================
let autoPlay = false;
let autoFlowAbort = false; // flag to cancel current auto flow

function toggleAutoPlay() {
  autoPlay = !autoPlay;
  const btn = document.getElementById('auto-play-btn');
  if (autoPlay) {
    btn.textContent = '▶ 自動ON';
    btn.classList.add('on');
    showToast('自動再生ON：日本語→英語→次の問題と自動で進みます');
  } else {
    btn.textContent = '▶ 自動OFF';
    btn.classList.remove('on');
    autoFlowAbort = true;
    stopAudio();
    setApStatus('idle', '');
    showToast('自動再生OFF');
  }
  const bar = document.getElementById('autoplay-bar');
  if (bar) bar.classList.toggle('visible', autoPlay);
}

function setApStatus(state, label) {
  const dot = document.getElementById('ap-dot');
  const lbl = document.getElementById('ap-label');
  if (!dot || !lbl) return;
  dot.className = 'ap-dot ' + state;
  lbl.textContent = label || '自動再生モード';
  const card = document.getElementById('flash-card');
  if (card) {
    card.classList.remove('jp-speaking', 'en-speaking');
    if (state === 'jp') card.classList.add('jp-speaking');
    if (state === 'en') card.classList.add('en-speaking');
  }
}

// The main auto-play coroutine
async function runAutoFlow(phraseId) {
  const p = PHRASES.find(x => x.id === phraseId);
  if (!p) return;

  // Step 1: speak Japanese
  setApStatus('jp', '🇯🇵 日本語を読み上げ中...');
  await speakWebSpeech(p.jp, 'ja');
  if (autoFlowAbort) return;

  // Step 2: wait 1.5s
  setApStatus('wait', '少々お待ちください...');
  await sleep(1500);
  if (autoFlowAbort) return;

  // Step 3: reveal card + speak English
  revealCard(true);
  await sleep(200);
  if (autoFlowAbort) return;

  setApStatus('en', '🇦🇺 英語を読み上げ中...');
  await speakWebSpeech(p.en, 'en');
  if (autoFlowAbort) return;

  // Step 4: iOS cannot auto-advance without user gesture
  // Show a prominent "Next" button and wait for tap
  setApStatus('idle', '✅ 次の問題へタップ');
  showNextBtn();
}

  const bar = document.getElementById('autoplay-bar');

    bar.innerHTML = `

  }
}

function sleep(ms) {
  return new Promise(resolve => setTimeout(resolve, ms));
}

function autoAdvance() {
  // In auto mode, just move forward (counts as OK for stats)
  const p = queue[qIdx];
  if (!p) return;
  sessionOk++;
  wrong.delete(p.id);
  if (currentMode === 'loop') {
    loopCounts[p.id] = (loopCounts[p.id] || 0) + 1;
    if (loopCounts[p.id] >= 5) { mastered.add(p.id); save(); qIdx++; }
    else { const ins = qIdx + 1 + Math.floor(Math.random() * Math.min(5, queue.length - qIdx - 1)); queue.splice(ins, 0, p); qIdx++; }
  } else {
    mastered.add(p.id); save(); qIdx++;
  }
  updateHeader();
  showCard();
}

  autoFlowAbort = true;
  // Restore bar
  restoreApBar();
  autoAdvance();
}

function restoreApBar() {
  const bar = document.getElementById('autoplay-bar');
  if (bar) {
    bar.innerHTML = `
      <div class="ap-left">
        <div class="ap-dot idle" id="ap-dot"></div>
        <span class="ap-label" id="ap-label">自動再生モード</span>
      </div>
      <button class="ap-skip-btn" onclick="autoSkipNow()">今すぐ次へ →</button>
    `;
  }
}
function sleep(ms) {
  return new Promise(resolve => setTimeout(resolve, ms));
}

function autoAdvance() {
  // In auto mode, just move forward (counts as OK for stats)
  const p = queue[qIdx];
  if (!p) return;
  sessionOk++;
  wrong.delete(p.id);
  if (currentMode === 'loop') {
    loopCounts[p.id] = (loopCounts[p.id] || 0) + 1;
    if (loopCounts[p.id] >= 5) { mastered.add(p.id); save(); qIdx++; }
    else { const ins = qIdx + 1 + Math.floor(Math.random() * Math.min(5, queue.length - qIdx - 1)); queue.splice(ins, 0, p); qIdx++; }
  } else {
    mastered.add(p.id); save(); qIdx++;
  }
  updateHeader();
  showCard();
}

function autoSkipNow() {
  autoFlowAbort = true;
  stopAudio();
  setApStatus('idle', '自動再生モード');
  qIdx++;
  showCard();
}

// Manual English play button
async function playEnglishManual() {
  if (isPlaying) { stopAudio(); return; }
  const p = queue[qIdx];
  if (!p) return;
  setVoiceBtnState(true);
  setVoiceStatus('英語を読み上げ中...');
  await speakGoogle(p.en, 'en');
  setVoiceBtnState(false);
  setVoiceStatus('');
}

// List page play
async function playPhrase(en) {
  if (isPlaying) { stopAudio(); return; }
  await speakGoogle(en, 'en');
}



// ===================== STATE =====================
let mastered = new Set(JSON.parse(localStorage.getItem('jt_m') || '[]'));
let wrong = new Set(JSON.parse(localStorage.getItem('jt_w') || '[]'));
let queue = [], qIdx = 0, isRevealed = false;
let currentMode = 'normal', selectedCat = 'all';
let sessionOk = 0, sessionNg = 0;
let timerInterval = null, timerLeft = 3;
let loopCounts = {};

function save() {
  localStorage.setItem('jt_m', JSON.stringify([...mastered]));
  localStorage.setItem('jt_w', JSON.stringify([...wrong]));
}
function updateHeader() { document.getElementById('h-mastered').textContent = mastered.size; }

function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2500);
}

function switchTab(p, btn) {
  document.querySelectorAll('.page').forEach(x => x.classList.remove('active'));
  document.querySelectorAll('.tab').forEach(x => x.classList.remove('active'));
  document.getElementById('page-' + p).classList.add('active');
  btn.classList.add('active');
  if (p === 'list') renderList();
  if (p === 'stats') renderStats();
}

function initSetup() {
  const cc = document.getElementById('cat-chips');
  cc.innerHTML = `<button class="chip active" onclick="selCat('all',this)">すべて (${PHRASES.length})</button>`;
  CATS.forEach(c => {
    const n = PHRASES.filter(p => p.cat === c).length;
    cc.innerHTML += `<button class="chip" onclick="selCat('${c}',this)">${c} (${n})</button>`;
  });
}
function selCat(cat, btn) {
  selectedCat = cat;
  document.querySelectorAll('#cat-chips .chip').forEach(c => c.classList.remove('active'));
  btn.classList.add('active');
}
function selectMode(mode) {
  currentMode = mode;
  document.querySelectorAll('.mode-card').forEach(c => c.classList.remove('selected'));
  document.getElementById('mode-' + mode).classList.add('selected');
}

function startTraining() {
  let pool = selectedCat === 'all' ? [...PHRASES] : PHRASES.filter(p => p.cat === selectedCat);
  if (currentMode === 'review') pool = pool.filter(p => !mastered.has(p.id) || wrong.has(p.id));
  if (pool.length === 0) { alert('該当するフレーズがありません！'); return; }
  for (let i = pool.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [pool[i], pool[j]] = [pool[j], pool[i]]; }
  queue = pool; qIdx = 0; sessionOk = 0; sessionNg = 0; loopCounts = {};
  document.getElementById('train-setup').style.display = 'none';
  document.getElementById('train-result').style.display = 'none';
  document.getElementById('train-area').style.display = 'block';
  document.getElementById('timer-wrap').style.display = currentMode === 'timer' ? 'flex' : 'none';
  document.getElementById('loop-banner').style.display = currentMode === 'loop' ? 'block' : 'none';
  document.getElementById('autoplay-bar').classList.toggle('visible', autoPlay);
  showCard();
}

function showCard() {
  if (qIdx >= queue.length) { endTraining(); return; }
  const p = queue[qIdx]; isRevealed = false;

  // Abort any running auto flow and stop audio
  autoFlowAbort = true;
  stopAudio();
  setApStatus('idle', '自動再生モード');

  document.getElementById('flash-card').className = 'flash-card';
  document.getElementById('card-cat').textContent = p.cat;
  document.getElementById('card-jp').textContent = p.jp;
  document.getElementById('card-sub').textContent = p.sub || '';
  document.getElementById('card-en').textContent = p.en;
  document.getElementById('card-alt').textContent = p.alt ? '💡 ' + p.alt : '';
  document.getElementById('card-tip').textContent = p.tip ? '🔑 ' + p.tip : '';
  document.getElementById('card-chunks').innerHTML = (p.chunks || []).map((c, i) =>
    `<div class="cc-row"><span class="cc-num">${i + 1}</span><span class="cc-en">${c}</span></div>`).join('');
  document.getElementById('card-hint').style.display = '';
  document.getElementById('btn-reveal').style.display = 'inline-block';
  document.getElementById('btn-ok').style.display = 'none';
  document.getElementById('btn-ng').style.display = 'none';
  document.getElementById('voice-btn-wrap').style.display = 'none';
  setVoiceBtnState(false);
  setVoiceStatus('');
  document.getElementById('train-ctr').textContent = `${qIdx + 1} / ${queue.length}`;
  document.getElementById('train-prog').style.width = (qIdx / queue.length * 100) + '%';
  if (currentMode === 'loop') {
    const cnt = loopCounts[p.id] || 0;
    document.getElementById('loop-remain').textContent = 5 - cnt;
  }

  // Auto-play flow: start after short delay so card renders first
  if (autoPlay) {
    const flowId = p.id;
    const myToken = currentFlowToken; // capture token AFTER stopAudio incremented it
    setTimeout(() => {
      // Only start if no new stopAudio has been called since
      if (myToken !== currentFlowToken) return;
      autoFlowAbort = false;
      runAutoFlow(flowId);
    }, 400);
  } else if (currentMode === 'timer') {
    startTimer();
  }
}

function onCardTap() {
  if (autoPlay) {
    // In auto mode, tapping the card cancels auto flow and manual reveal
    autoFlowAbort = true;
    stopAudio();
    setApStatus('idle', '手動モード（一時停止中）');
    revealCard(true);
  } else {
    revealCard(false);
  }
}

// silent: true = don't trigger auto flow again from here
function revealCard(silent) {
  if (isRevealed) return; isRevealed = true;
  clearInterval(timerInterval);
  document.getElementById('flash-card').classList.add('revealed');
  document.getElementById('flash-card').classList.remove('jp-speaking', 'en-speaking');
  document.getElementById('card-hint').style.display = 'none';
  document.getElementById('btn-reveal').style.display = 'none';
  document.getElementById('btn-ok').style.display = 'inline-block';
  document.getElementById('btn-ng').style.display = 'inline-block';
  document.getElementById('voice-btn-wrap').style.display = 'flex';
}

function startTimer() {
  clearInterval(timerInterval); timerLeft = 3; updateTimerUI(3, 3);
  timerInterval = setInterval(() => {
    timerLeft -= 0.1;
    if (timerLeft <= 0) { clearInterval(timerInterval); timerLeft = 0; revealCard(false); }
    updateTimerUI(timerLeft, 3);
  }, 100);
}
function updateTimerUI(val, max) {
  const offset = 169.6 * (1 - val / max);
  document.getElementById('timer-circle').style.strokeDashoffset = offset;
  document.getElementById('timer-num').textContent = Math.ceil(val);
  document.getElementById('timer-circle').style.stroke = val > 2 ? '#c8962a' : val > 1 ? '#c86a2a' : '#a03030';
}

function markOk() {
  autoFlowAbort = true; stopAudio();
  const p = queue[qIdx]; sessionOk++; wrong.delete(p.id);
  if (currentMode === 'loop') {
    loopCounts[p.id] = (loopCounts[p.id] || 0) + 1;
    if (loopCounts[p.id] >= 5) { mastered.add(p.id); save(); qIdx++; }
    else { const ins = qIdx + 1 + Math.floor(Math.random() * Math.min(5, queue.length - qIdx - 1)); queue.splice(ins, 0, p); qIdx++; }
  } else { mastered.add(p.id); save(); qIdx++; }
  updateHeader(); showCard();
}
function markNg() {
  autoFlowAbort = true; stopAudio();
  const p = queue[qIdx]; sessionNg++; wrong.add(p.id);
  if (currentMode === 'loop') {
    loopCounts[p.id] = 0;
    const ins = qIdx + 1 + Math.floor(Math.random() * Math.min(4, queue.length - qIdx - 1));
    queue.splice(Math.min(ins, queue.length), 0, p);
  }
  save(); qIdx++; showCard();
}
function skipCard() { autoFlowAbort = true; stopAudio(); qIdx++; showCard(); }
function quitTraining() { autoFlowAbort = true; stopAudio(); clearInterval(timerInterval); backToSetup(); }

function endTraining() {
  autoFlowAbort = true; stopAudio(); clearInterval(timerInterval);
  document.getElementById('train-area').style.display = 'none';
  document.getElementById('train-result').style.display = 'block';
  const total = sessionOk + sessionNg;
  const pct = total > 0 ? Math.round(sessionOk / total * 100) : 0;
  document.getElementById('res-ok').textContent = sessionOk;
  document.getElementById('res-ng').textContent = sessionNg;
  document.getElementById('res-total').textContent = total;
  document.getElementById('res-emoji').textContent = pct >= 80 ? '🎉' : pct >= 50 ? '💪' : '🔥';
  document.getElementById('res-title').textContent = pct >= 80 ? '素晴らしい！' : pct >= 50 ? 'いい調子！' : 'もう一息！';
  document.getElementById('res-sub').textContent = `正解率 ${pct}%（${sessionOk}/${total}）`;
  document.getElementById('res-loop-btn').style.display = sessionNg > 0 && currentMode !== 'loop' ? 'block' : 'none';
  updateHeader();
}

function startLoopFromResult() {
  currentMode = 'loop';
  const ng = [...wrong];
  if (ng.length === 0) { alert('間違えたフレーズがありません！'); return; }
  queue = PHRASES.filter(p => ng.includes(p.id));
  for (let i = queue.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [queue[i], queue[j]] = [queue[j], queue[i]]; }
  qIdx = 0; sessionOk = 0; sessionNg = 0; loopCounts = {};
  document.getElementById('train-result').style.display = 'none';
  document.getElementById('train-area').style.display = 'block';
  document.getElementById('loop-banner').style.display = 'block';
  document.getElementById('timer-wrap').style.display = 'none';
  document.getElementById('autoplay-bar').classList.toggle('visible', autoPlay);
  showCard();
}
function backToSetup() {
  document.getElementById('train-area').style.display = 'none';
  document.getElementById('train-result').style.display = 'none';
  document.getElementById('train-setup').style.display = 'block';
}

function renderList() {
  const lc = document.getElementById('list-chips');
  lc.innerHTML = `<button class="chip active" onclick="filterList('all',this)">すべて</button>`;
  CATS.forEach(c => { lc.innerHTML += `<button class="chip" onclick="filterList('${c}',this)">${c}</button>`; });
  filterList('all', lc.firstElementChild);
}
function filterList(cat, btn) {
  document.querySelectorAll('#list-chips .chip').forEach(c => c.classList.remove('active'));
  btn.classList.add('active');
  const pool = cat === 'all' ? PHRASES : PHRASES.filter(p => p.cat === cat);
  document.getElementById('list-items').innerHTML = pool.map(p => `
    <div class="list-item">
      <div class="li-cat">
        <span>${p.cat}</span>
        <div style="display:flex;align-items:center;gap:6px">
          <button class="li-voice-btn" onclick="playPhrase(${JSON.stringify(p.en)})">🔊</button>
          <span class="li-done ${mastered.has(p.id) ? 'show' : ''}">✓ 習得</span>
        </div>
      </div>
      <div class="li-jp">${p.jp}</div>
      <div class="li-chunks">${(p.chunks || []).map((c, i) =>
        `<div class="li-chunk-row"><span class="li-cn">${i + 1}</span><span class="li-ce">${c}</span></div>`).join('')}</div>
      <div class="li-full">${p.en}</div>
    </div>`).join('');
}

function renderStats() {
  document.getElementById('st-total').textContent = PHRASES.length;
  document.getElementById('st-master').textContent = mastered.size;
  document.getElementById('st-learn').textContent = PHRASES.length - mastered.size;
  document.getElementById('cat-stats').innerHTML = CATS.map(c => {
    const total = PHRASES.filter(p => p.cat === c).length;
    const done = PHRASES.filter(p => p.cat === c && mastered.has(p.id)).length;
    const pct = Math.round(done / total * 100);
    return `<div class="cat-stat">
      <div class="cst"><span class="csn">${c}</span><span class="csp">${done}/${total} (${pct}%)</span></div>
      <div class="csb"><div class="csf" style="width:${pct}%;background:${CAT_COLORS[c] || 'var(--moss)'}"></div></div>
    </div>`;
  }).join('');
}
function resetAll() {
  if (!confirm('全データをリセットしますか？')) return;
  mastered.clear(); wrong.clear(); save(); updateHeader(); renderStats();
}


// INIT
initSetup(); updateHeader();
// iOS版: APIキー不要（Web Speech API使用）
</script>
