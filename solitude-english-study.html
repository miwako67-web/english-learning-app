<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>孤独の英語 — Speaking Practice</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400&family=Noto+Sans+JP:wght@300;400;500&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0;}
:root{
  --bg:#0f0e0c;
  --bg2:#171613;
  --bg3:#201e1a;
  --gold:#c8a96e;
  --gold2:#e8c88e;
  --text:#e8e4dc;
  --text2:#b0a898;
  --text3:#706860;
  --border:#2a2620;
  --highlight:#3a2800;
  --highlight2:#c8a96e22;
  --green:#5a8a5a;
  --green2:#0e1a0e;
}
html,body{background:var(--bg);min-height:100%;color:var(--text);}
body{font-family:'Noto Sans JP',sans-serif;}

/* Layout */
.app{max-width:720px;margin:0 auto;min-height:100vh;padding-bottom:80px;}

/* Header */
.header{padding:32px 24px 24px;border-bottom:0.5px solid var(--border);}
.header-top{display:flex;align-items:flex-start;justify-content:space-between;margin-bottom:16px;}
.title{font-family:'Cormorant Garamond',serif;font-size:28px;font-weight:600;color:var(--text);line-height:1.2;}
.subtitle{font-size:11px;color:var(--text3);letter-spacing:1.5px;text-transform:uppercase;margin-top:4px;}
.speed-control{display:flex;align-items:center;gap:8px;background:var(--bg3);border:0.5px solid var(--border);border-radius:20px;padding:6px 12px;}
.speed-label{font-size:10px;color:var(--text3);letter-spacing:0.5px;}
.speed-val{font-size:12px;color:var(--gold);min-width:28px;text-align:center;}
input[type=range]{-webkit-appearance:none;width:80px;height:2px;background:var(--border);border-radius:1px;outline:none;}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:12px;height:12px;border-radius:50%;background:var(--gold);cursor:pointer;}

/* Progress */
.progress-bar{height:2px;background:var(--border);margin:16px 0 0;}
.progress-fill{height:100%;background:var(--gold);transition:width 0.4s ease;border-radius:1px;}
.progress-info{display:flex;justify-content:space-between;margin-top:6px;}
.progress-text{font-size:10px;color:var(--text3);}

/* Section cards */
.sections{padding:0 16px;margin-top:24px;}
.section-card{background:var(--bg2);border:0.5px solid var(--border);border-radius:12px;margin-bottom:16px;overflow:hidden;transition:border-color 0.2s;}
.section-card.active{border-color:var(--gold);}
.section-header{padding:16px 20px;display:flex;align-items:center;gap:12px;cursor:pointer;}
.section-num{width:28px;height:28px;border-radius:50%;background:var(--bg3);border:0.5px solid var(--border);display:flex;align-items:center;justify-content:center;font-size:11px;color:var(--text3);flex-shrink:0;font-family:'Cormorant Garamond',serif;}
.section-card.active .section-num{background:var(--highlight);border-color:var(--gold);color:var(--gold);}
.section-title-ja{font-size:13px;color:var(--text);font-weight:500;}
.section-title-en{font-size:11px;color:var(--text3);margin-top:1px;}
.section-arrow{margin-left:auto;font-size:12px;color:var(--text3);transition:transform 0.2s;}
.section-card.open .section-arrow{transform:rotate(180deg);}

.section-body{display:none;padding:0 20px 20px;}
.section-card.open .section-body{display:block;}

/* Japanese text */
.ja-block{background:var(--bg3);border-radius:8px;padding:14px 16px;margin-bottom:16px;border-left:2px solid var(--gold);}
.ja-label{font-size:9px;color:var(--text3);letter-spacing:1px;text-transform:uppercase;margin-bottom:6px;}
.ja-text{font-size:13px;color:var(--text2);line-height:1.9;}

/* English text block */
.en-block{background:var(--bg3);border-radius:8px;padding:14px 16px;margin-bottom:16px;}
.en-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px;}
.en-label{font-size:9px;color:var(--text3);letter-spacing:1px;text-transform:uppercase;}
.en-text{font-size:14px;color:var(--text);line-height:1.9;font-family:'Cormorant Garamond',serif;}
.speak-btn{display:flex;align-items:center;gap:6px;padding:6px 12px;background:none;border:0.5px solid var(--border);border-radius:20px;color:var(--text3);font-size:11px;cursor:pointer;font-family:'Noto Sans JP',sans-serif;transition:all 0.2s;flex-shrink:0;}
.speak-btn:hover{border-color:var(--gold);color:var(--gold);}
.speak-btn.playing{border-color:var(--gold);color:var(--gold);background:var(--highlight);}
.speak-icon{font-size:13px;}

/* Highlights */
.hl{background:var(--highlight);color:var(--gold2);border-radius:3px;padding:1px 4px;cursor:pointer;border-bottom:1px solid var(--gold);transition:background 0.15s;}
.hl:hover{background:var(--gold);color:var(--bg);}

/* Grammar popup */
.grammar-popup{display:none;background:var(--bg);border:0.5px solid var(--gold);border-radius:10px;padding:16px 18px;margin:12px 0;animation:fadeIn 0.2s ease;}
.grammar-popup.show{display:block;}
@keyframes fadeIn{from{opacity:0;transform:translateY(-4px);}to{opacity:1;transform:translateY(0);}}
.grammar-title{font-size:11px;color:var(--gold);letter-spacing:1px;text-transform:uppercase;margin-bottom:6px;}
.grammar-pattern{font-family:'Cormorant Garamond',serif;font-size:18px;color:var(--text);margin-bottom:4px;}
.grammar-desc{font-size:12px;color:var(--text2);line-height:1.7;margin-bottom:12px;}

/* Examples */
.examples-label{font-size:9px;color:var(--text3);letter-spacing:1px;text-transform:uppercase;margin-bottom:8px;}
.example-item{background:var(--bg2);border-radius:8px;padding:12px 14px;margin-bottom:8px;}
.ex-en{font-family:'Cormorant Garamond',serif;font-size:15px;color:var(--text);margin-bottom:4px;display:flex;align-items:flex-start;justify-content:space-between;gap:8px;}
.ex-en-text{flex:1;line-height:1.6;}
.ex-ja{font-size:12px;color:var(--text3);line-height:1.6;}
.ex-speak{width:26px;height:26px;border-radius:50%;border:0.5px solid var(--border);background:none;color:var(--text3);font-size:11px;cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0;transition:all 0.2s;}
.ex-speak:hover{border-color:var(--gold);color:var(--gold);}
.ex-speak.playing{border-color:var(--gold);color:var(--gold);background:var(--highlight);}

/* Nav buttons */
.nav-bar{position:fixed;bottom:0;left:0;right:0;background:var(--bg);border-top:0.5px solid var(--border);padding:12px 16px;display:flex;gap:10px;max-width:720px;margin:0 auto;}
.nav-btn{flex:1;padding:12px;border-radius:8px;border:0.5px solid var(--border);background:none;color:var(--text3);font-size:12px;cursor:pointer;font-family:'Noto Sans JP',sans-serif;transition:all 0.2s;}
.nav-btn:hover{border-color:var(--gold);color:var(--gold);}
.nav-btn.primary{background:var(--gold);border-color:var(--gold);color:var(--bg);font-weight:500;}
.nav-btn.primary:hover{background:var(--gold2);}
.nav-btn:disabled{opacity:0.3;cursor:default;}

/* Read all btn */
.read-all-btn{display:flex;align-items:center;gap:8px;padding:10px 16px;background:var(--highlight2);border:0.5px solid var(--gold);border-radius:20px;color:var(--gold);font-size:12px;cursor:pointer;font-family:'Noto Sans JP',sans-serif;transition:all 0.2s;margin-bottom:16px;}
.read-all-btn:hover{background:var(--highlight);}
.read-all-btn.playing{background:var(--highlight);}
</style>
</head>
<body>
<div class="app">
  <div class="header">
    <div class="header-top">
      <div>
        <div class="title">孤独という贅沢</div>
        <div class="subtitle">English Speaking Practice</div>
      </div>
      <div class="speed-control">
        <span class="speed-label">Speed</span>
        <input type="range" id="speedSlider" min="0.5" max="1.5" step="0.1" value="0.9">
        <span class="speed-val" id="speedVal">0.9x</span>
      </div>
    </div>
    <div class="progress-bar"><div class="progress-fill" id="progressFill" style="width:0%"></div></div>
    <div class="progress-info">
      <span class="progress-text">学習の進捗</span>
      <span class="progress-text" id="progressText">0 / 8 セクション</span>
    </div>
  </div>

  <div class="sections" id="sections"></div>
</div>

<div class="nav-bar" id="navBar">
  <button class="nav-btn" id="prevBtn" onclick="navigate(-1)" disabled>← 前へ</button>
  <button class="nav-btn primary" id="nextBtn" onclick="navigate(1)">次へ →</button>
</div>

<script>
var speed = 0.9;
var currentSection = 0;
var openSections = {};
var completedSections = {};

var DATA = [
  {
    num: "01",
    titleJa: "孤独と孤立の違い",
    titleEn: "Solitude vs. Isolation",
    ja: "孤立とは、望まないのに一人になってしまうことだ。誰にも必要とされていないと感じる。世界から切り離されたような状態だ。\n\nしかし孤独は違う。孤独とは自分で選んだ一人の時間のことだ。誰も邪魔しない。誰かの期待に応えなくていい。完全に自由だ。",
    en: "Isolation means being alone <hl id='hl1-1' data-grammar='g1-1'>when you do not want to be</hl>. You feel that nobody needs you. You feel cut off from the world.\n\nBut solitude is <hl id='hl1-2' data-grammar='g1-2'>different</hl>. Solitude is time alone <hl id='hl1-3' data-grammar='g1-3'>that you choose for yourself</hl>. Nobody bothers you. You do not have to meet anyone's expectations. You are completely free.",
    grammars: [
      {
        id: "g1-1",
        pattern: "when you do not want to ~",
        title: "〜したくないのに",
        desc: "「望んでいないのに〜する状態」を表す表現。whenは「〜の時」という意味で、否定形と組み合わせると「望まない状況」を表せる。",
        examples: [
          {en:"I have to work when I do not want to.", ja:"やりたくないのに働かなければならない。"},
          {en:"She cries when she does not want to show weakness.", ja:"弱さを見せたくないのに、彼女は泣いてしまう。"},
          {en:"He speaks when he does not want to draw attention.", ja:"目立ちたくないのに、彼は話してしまう。"}
        ]
      },
      {
        id: "g1-2",
        pattern: "A is different from B",
        title: "AはBとは違う",
        desc: "二つのものを対比する時の基本表現。\"But ~ is different\" で「しかし〜は違う」と強調できる。",
        examples: [
          {en:"But this time is different.", ja:"しかし今回は違う。"},
          {en:"Confidence is different from arrogance.", ja:"自信と傲慢さは違う。"},
          {en:"Being busy is different from being productive.", ja:"忙しいことと生産的であることは違う。"}
        ]
      },
      {
        id: "g1-3",
        pattern: "~ that you choose for yourself",
        title: "自分で選んだ〜",
        desc: "関係代名詞thatを使って「自分で選んだ」という修飾を加える表現。for yourselfで「自分自身のために」という意味が加わる。",
        examples: [
          {en:"Live a life that you choose for yourself.", ja:"自分で選んだ人生を生きなさい。"},
          {en:"Find a path that you choose for yourself.", ja:"自分で選んだ道を見つけなさい。"},
          {en:"Build a future that you choose for yourself.", ja:"自分で選んだ未来を築きなさい。"}
        ]
      }
    ]
  },
  {
    num: "02",
    titleJa: "孤独を恐れる2つの理由",
    titleEn: "Two Reasons We Fear Solitude",
    ja: "大きな理由が二つある。\n\n一つ目は群れの安心感だ。昔、一人でいれば命の危険があった。その古い記憶が今も心の奥底に刻まれている。しかし今の時代、一人でいても命の危険などない。ただ心だけが古い恐怖を引きずっているのだ。\n\n二つ目は他人の目という呪縛だ。一人でいる人を見ると「友達がいないのでは」と決めつける。しかしあなたの人生はあなたのものだ。",
    en: "<hl id='hl2-1' data-grammar='g2-1'>There are two big reasons</hl>.\n\nThe first is the comfort of the group. Long ago, being alone was dangerous. <hl id='hl2-2' data-grammar='g2-2'>That old memory is still deep inside you</hl>. But today, you are safe alone. <hl id='hl2-3' data-grammar='g2-3'>Only your heart is still carrying that old fear</hl>.\n\nThe second reason is other people's eyes. If someone is alone, people say they must be lonely. But <hl id='hl2-4' data-grammar='g2-4'>your life is yours</hl>. Living by other people's rules is a sad way to live.",
    grammars: [
      {
        id: "g2-1",
        pattern: "There are ~ reasons",
        title: "〜つの理由がある",
        desc: "理由や要因を提示する時の定番表現。There are / There is で「〜がある」という存在を示す。",
        examples: [
          {en:"There are three reasons why I study English.", ja:"私が英語を勉強する理由が三つある。"},
          {en:"There is one important reason to try.", ja:"挑戦する重要な理由が一つある。"},
          {en:"There are many reasons to be grateful.", ja:"感謝する理由はたくさんある。"}
        ]
      },
      {
        id: "g2-2",
        pattern: "~ is still ~ inside you",
        title: "〜はまだあなたの中に〜",
        desc: "stillは「今もなお」という継続を表す。「過去のものが今も残っている」という状況を表現するのに使う。",
        examples: [
          {en:"That dream is still alive inside you.", ja:"その夢はまだあなたの中で生きている。"},
          {en:"The old wound is still fresh inside you.", ja:"古い傷はまだあなたの中に新しく残っている。"},
          {en:"That courage is still there inside you.", ja:"その勇気はまだあなたの中にある。"}
        ]
      },
      {
        id: "g2-3",
        pattern: "Only ~ is still ~ing",
        title: "〜だけがまだ〜している",
        desc: "Onlyで「唯一〜だけが」と限定する表現。「それ以外は変わったのに、〜だけが残っている」というニュアンス。",
        examples: [
          {en:"Only your mind is still holding you back.", ja:"あなたの心だけがまだあなたを引き止めている。"},
          {en:"Only the past is still controlling your present.", ja:"過去だけがまだあなたの現在をコントロールしている。"},
          {en:"Only your doubt is still standing in the way.", ja:"あなたの疑いだけがまだ邪魔をしている。"}
        ]
      },
      {
        id: "g2-4",
        pattern: "Your ~ is yours",
        title: "あなたの〜はあなたのものだ",
        desc: "所有を強調する表現。\"Your life is yours\" は「あなたの人生はあなた自身のものだ」という力強い宣言。",
        examples: [
          {en:"Your time is yours — use it well.", ja:"あなたの時間はあなたのものだ。上手に使いなさい。"},
          {en:"Your choice is yours, not theirs.", ja:"その選択はあなたのもので、彼らのものではない。"},
          {en:"Your story is yours to write.", ja:"あなたの物語はあなたが書くものだ。"}
        ]
      }
    ]
  },
  {
    num: "03",
    titleJa: "教え①：雑音が消える",
    titleEn: "Teaching 1: The Noise Stops",
    ja: "毎朝、たくさんの声が聞こえてくる。家族の期待、職場での役割、社会の常識、誰かの評価。これらの声が心の中で響いている。その雑音の中で、自分自身の声が聞こえなくなる。\n\n一人で静かにいる時、初めて自分自身の声が聞こえてくる。それが孤独の最初の贈り物だ。",
    en: "Every morning, you hear many voices. Your family's hopes. Your role at work. Society's rules. What someone thinks of you. <hl id='hl3-1' data-grammar='g3-1'>All these voices are loud inside your heart</hl>.\n\n<hl id='hl3-2' data-grammar='g3-2'>In that noise, you cannot hear your own voice</hl>. What do you feel? What do you want? What is important to you?\n\n<hl id='hl3-3' data-grammar='g3-3'>When you are alone and quiet, for the first time, you can hear your own voice</hl>. That is the first gift of solitude.",
    grammars: [
      {
        id: "g3-1",
        pattern: "All these ~ are ~ inside your heart",
        title: "これらの〜はすべて心の中で〜だ",
        desc: "All theseで「これらすべて」と複数のものをまとめる表現。inside your heartで「心の内側で」という内面的な場所を表す。",
        examples: [
          {en:"All these worries are just noise inside your heart.", ja:"これらの心配事はすべて心の中の雑音に過ぎない。"},
          {en:"All these memories are still alive inside your heart.", ja:"これらの記憶はすべてまだ心の中で生きている。"},
          {en:"All these feelings are real inside your heart.", ja:"これらの感情はすべて心の中で本物だ。"}
        ]
      },
      {
        id: "g3-2",
        pattern: "In that ~, you cannot ~",
        title: "その〜の中では、あなたは〜できない",
        desc: "\"In that ~\" で「その状況の中では」という条件を設定し、cannot で「〜できない」という不可能を表す。",
        examples: [
          {en:"In that rush, you cannot think clearly.", ja:"その急ぎの中では、明確に考えることができない。"},
          {en:"In that fear, you cannot make good choices.", ja:"その恐怖の中では、良い選択ができない。"},
          {en:"In that crowd, you cannot find yourself.", ja:"その群衆の中では、自分自身を見つけることができない。"}
        ]
      },
      {
        id: "g3-3",
        pattern: "for the first time, you can ~",
        title: "初めて、〜できる",
        desc: "\"for the first time\" は「初めて」という意味。ある条件が揃った時に初めて可能になることを表す。",
        examples: [
          {en:"When you stop running, for the first time, you can rest.", ja:"走るのをやめた時、初めて休むことができる。"},
          {en:"When you are honest, for the first time, you can be free.", ja:"正直になった時、初めて自由になれる。"},
          {en:"When you let go, for the first time, you can breathe.", ja:"手放した時、初めて息ができる。"}
        ]
      }
    ]
  },
  {
    num: "04",
    titleJa: "教え②：自由への扉",
    titleEn: "Teaching 2: A Door to Freedom",
    ja: "誰かと一緒にいる時、あなたは常に何らかの役割を演じている。良い親、良い友人、良い社会人。空気を読み、相手に気を使う。それは悪いことではない。しかしそれだけでは心が疲れ果ててしまう。\n\n一人でいる時間こそ、その役割から解放される唯一の時間だ。",
    en: "<hl id='hl4-1' data-grammar='g4-1'>When you are with someone, you always play a role</hl>. A good parent. A good friend. A good worker. You read the room and use energy for others. That is not bad.\n\n<hl id='hl4-2' data-grammar='g4-2'>But if you always do that, your heart gets very tired</hl>.\n\nTime alone is <hl id='hl4-3' data-grammar='g4-3'>the only time you are free from those roles</hl>. Nobody is watching. You can just be yourself.",
    grammars: [
      {
        id: "g4-1",
        pattern: "When you are with ~, you always ~",
        title: "〜と一緒にいる時、あなたはいつも〜",
        desc: "When節で状況を設定し、always（いつも）で習慣的な行動を表す。「〜の時には決まって〜する」というパターン。",
        examples: [
          {en:"When you are with others, you always think of them first.", ja:"他の人といる時、あなたはいつも彼らのことを先に考える。"},
          {en:"When you are at work, you always wear a mask.", ja:"職場にいる時、あなたはいつも仮面をかぶっている。"},
          {en:"When you are with family, you always feel pressure.", ja:"家族といる時、あなたはいつもプレッシャーを感じる。"}
        ]
      },
      {
        id: "g4-2",
        pattern: "if you always ~, your ~ gets ~",
        title: "もし常に〜すれば、〜は〜になる",
        desc: "if条件節 + 結果の構造。\"gets + 形容詞\" で「〜な状態になる」という変化を表す。",
        examples: [
          {en:"If you always say yes, your life gets out of control.", ja:"もし常にYesと言えば、あなたの人生はコントロールを失う。"},
          {en:"If you always run, your body gets weak.", ja:"もし常に走り続ければ、あなたの体は弱くなる。"},
          {en:"If you always give, your heart gets empty.", ja:"もし常に与え続ければ、あなたの心は空っぽになる。"}
        ]
      },
      {
        id: "g4-3",
        pattern: "the only time you are free from ~",
        title: "〜から解放される唯一の時間",
        desc: "the only time は「唯一の時間」。free from ~ は「〜から解放されている」という意味の重要表現。",
        examples: [
          {en:"Sleep is the only time you are free from worry.", ja:"睡眠は心配から解放される唯一の時間だ。"},
          {en:"Nature is the only place you are free from screens.", ja:"自然はスクリーンから解放される唯一の場所だ。"},
          {en:"Morning walks are the only time you are free from noise.", ja:"朝の散歩は雑音から解放される唯一の時間だ。"}
        ]
      }
    ]
  },
  {
    num: "05",
    titleJa: "教え③：執着を手放す",
    titleEn: "Teaching 3: Let Go of Attachment",
    ja: "人が孤独を恐れる本当の理由は、孤独そのものではない。寂しさという感情に囚われているからだ。\n\n誰かに認めてほしい。誰かに必要とされたい。そうした願いが満たされない時、人は寂しさを感じる。\n\nしかしその執着を手放せば、一人でいることが苦しみではなくなる。それは寂しさではなく、穏やかな安らぎへと変わる。",
    en: "The real reason people fear being alone is <hl id='hl5-1' data-grammar='g5-1'>not solitude itself, but the feeling of loneliness</hl>.\n\nYou want someone to accept you. You want someone to need you. <hl id='hl5-2' data-grammar='g5-2'>When those wishes are not met, you feel lonely</hl>.\n\n<hl id='hl5-3' data-grammar='g5-3'>But if you let go of attachment, being alone is no longer painful</hl>. It becomes not loneliness, but calm peace.",

// Build grammars map
var grammarsMap = {};
DATA.forEach(function(sec) {
  sec.grammars.forEach(function(g) {
    grammarsMap[g.id] = g;
  });
});

// Render
function renderSections() {
  var container = document.getElementById('sections');
  container.innerHTML = '';
  DATA.forEach(function(sec, idx) {
    var isOpen = openSections[idx];
    var isActive = idx === currentSection;
    var card = document.createElement('div');
    card.className = 'section-card' + (isActive ? ' active' : '') + (isOpen ? ' open' : '');
    card.id = 'sec-' + idx;

    var enHtml = sec.en.replace(/\n/g, '<br>');
    // Replace hl tags
    enHtml = enHtml.replace(/<hl id='([^']+)' data-grammar='([^']+)'>(.*?)<\/hl>/g, function(m, id, grammar, text) {
      return '<span class="hl" id="' + id + '" data-grammar="' + grammar + '" onclick="toggleGrammar(\'' + grammar + '\', \'' + id + '\')">' + text + '</span>';
    });

    var grammarBlocks = sec.grammars.map(function(g) {
      var exHtml = g.examples.map(function(ex, ei) {
        return '<div class="example-item">'
          + '<div class="ex-en"><span class="ex-en-text">' + ex.en + '</span><button class="ex-speak" data-text="' + ex.en.replace(/"/g,'&quot;') + '" onclick="speakText(this, \'' + ex.en.replace(/'/g,"\\'") + '\')" title="読み上げ">🔊</button></div>'
          + '<div class="ex-ja">' + ex.ja + '</div>'
          + '</div>';
      }).join('');
      return '<div class="grammar-popup" id="' + g.id + '">'
        + '<div class="grammar-title">重要構文</div>'
        + '<div class="grammar-pattern">' + g.pattern + '</div>'
        + '<div class="grammar-desc">' + g.desc + '</div>'
        + '<div class="examples-label">この構文を使った例文</div>'
        + exHtml
        + '</div>';
    }).join('');

    card.innerHTML = '<div class="section-header" onclick="toggleSection(' + idx + ')">'
      + '<div class="section-num">' + sec.num + '</div>'
      + '<div><div class="section-title-ja">' + sec.titleJa + '</div><div class="section-title-en">' + sec.titleEn + '</div></div>'
      + '<div class="section-arrow">▼</div>'
      + '</div>'
      + '<div class="section-body">'
      + '<div class="ja-block"><div class="ja-label">日本語</div><div class="ja-text">' + sec.ja.replace(/\n/g,'<br>') + '</div></div>'
      + '<div class="en-block">'
      + '<div class="en-header"><div class="en-label">English</div>'
      + '<button class="speak-btn" id="speak-' + idx + '" onclick="speakSection(' + idx + ')">'
      + '<span class="speak-icon">🔊</span> 全文を読み上げ</button></div>'
      + '<div class="en-text" id="en-' + idx + '">' + enHtml + '</div>'
      + '</div>'
      + grammarBlocks
      + '</div>';
    container.appendChild(card);
  });
}

function toggleSection(idx) {
  openSections[idx] = !openSections[idx];
  currentSection = idx;
  renderSections();
  updateProgress();
  updateNav();
  if (openSections[idx]) {
    setTimeout(function() {
      var el = document.getElementById('sec-' + idx);
      if (el) el.scrollIntoView({behavior:'smooth', block:'start'});
    }, 50);
  }
}

function toggleGrammar(grammarId, hlId) {
  var popup = document.getElementById(grammarId);
  if (!popup) return;
  var isShow = popup.classList.contains('show');
  // Close all
  document.querySelectorAll('.grammar-popup').forEach(function(p) { p.classList.remove('show'); });
  if (!isShow) {
    popup.classList.add('show');
    // Scroll into view
    setTimeout(function() {
      popup.scrollIntoView({behavior:'smooth', block:'nearest'});
    }, 50);
  }
}

function navigate(dir) {
  var next = currentSection + dir;
  if (next < 0 || next >= DATA.length) return;
  // Close current, open next
  openSections[currentSection] = false;
  currentSection = next;
  openSections[currentSection] = true;
  completedSections[currentSection] = true;
  renderSections();
  updateProgress();
  updateNav();
  setTimeout(function() {
    var el = document.getElementById('sec-' + currentSection);
    if (el) el.scrollIntoView({behavior:'smooth', block:'start'});
  }, 50);
}

function updateProgress() {
  var done = Object.keys(completedSections).length;
  var pct = (done / DATA.length) * 100;
  document.getElementById('progressFill').style.width = pct + '%';
  document.getElementById('progressText').textContent = done + ' / ' + DATA.length + ' セクション';
}

function updateNav() {
  var prev = document.getElementById('prevBtn');
  var next = document.getElementById('nextBtn');
  if (prev) prev.disabled = currentSection === 0;
  if (next) {
    next.disabled = currentSection === DATA.length - 1;
    next.textContent = currentSection === DATA.length - 1 ? '完了 ✓' : '次へ →';
  }
}

// Speech
var currentUtterance = null;
function speakText(btn, text) {
  if (!window.speechSynthesis) { alert('お使いのブラウザは音声に対応していません。'); return; }
  if (currentUtterance) { window.speechSynthesis.cancel(); }
  // Reset all buttons
  document.querySelectorAll('.speak-btn, .ex-speak').forEach(function(b) { b.classList.remove('playing'); });
  var u = new SpeechSynthesisUtterance(text);
  u.lang = 'en-US';
  u.rate = speed;
  u.pitch = 1.0;
  if (btn) btn.classList.add('playing');
  u.onend = function() { if (btn) btn.classList.remove('playing'); };
  u.onerror = function() { if (btn) btn.classList.remove('playing'); };
  currentUtterance = u;
  window.speechSynthesis.speak(u);
}

function speakSection(idx) {
  var enEl = document.getElementById('en-' + idx);
  if (!enEl) return;
  var text = enEl.innerText || enEl.textContent;
  var btn = document.getElementById('speak-' + idx);
  speakText(btn, text);
}

// Speed slider
document.getElementById('speedSlider').addEventListener('input', function() {
  speed = parseFloat(this.value);
  document.getElementById('speedVal').textContent = speed.toFixed(1) + 'x';
});

// Init
openSections[0] = true;
completedSections[0] = true;
renderSections();
updateProgress();
updateNav();
</script>
